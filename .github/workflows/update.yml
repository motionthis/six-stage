name: Update page

on:
  schedule:
    - cron: "30 21 * * 1-5"   # 21:30 UTC on weekdays, after the US market close
  workflow_dispatch:           # "Run workflow" button for a manual refresh
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch prices and build the page
        run: python cycle_live.py --no-open --out site/index.html

      - name: Add app files
        run: cp web/* site/

      - name: Save the data cache (used if a data source is down next time)
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_data.json backtest.json macro.json
          if ! git diff --cached --quiet; then
            git commit -m "Update market data"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
