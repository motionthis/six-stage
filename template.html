function drawBacktest() {
  const t = T[lang];
  const sec = document.getElementById("bt-sec");
  const bt = btData();
  if (!bt) { sec.hidden = true; return; }
  sec.hidden = false;
  document.getElementById("t-bt").textContent = t.btTitle;
  document.getElementById("t-bt-kicker").textContent = t.btKicker;
  const mode = document.getElementById("bt-mode");
  mode.replaceChildren();
  [["data", t.btModeData], ["tb", t.btModeTb]].forEach(([k, label]) => {
    const b = h("button", null, label);
    b.type = "button"; b.id = "bt-mode-" + k;
    b.setAttribute("aria-pressed", String(btMode === k));
    b.addEventListener("click", () => { btMode = k; drawBacktest(); document.getElementById("bt-mode-" + k).focus(); });
    mode.append(b);
  });
  drawRotation(bt);

  const total = Object.values(bt.counts).reduce((a, b) => a + b, 0);
  document.getElementById("t-bt-sec").textContent = t.btSecTitle;
  document.getElementById("bt-intro").textContent =
    t.btIntro(ym(bt.start), ym(bt.end), t.num(total), t.num(+period)) + " " + t.mixedOut(t.num(bt.mixed));

  // Sector heatmap with textbook-vs-data comparison
  const tb = document.getElementById("heat-sec");
  tb.replaceChildren(heatHead(bt, t.colSector, [t.colBest, t.colChart, t.colAgree, t.colStable]));
  let stableYes = 0, stableN = 0;
  const tally = { yes: 0, near: 0, no: 0 };
  let counted = 0;
  SECTOR_META.forEach(([sym, en, fa, chartStage]) => {
    const cells = bt.sectors[sym];
    const tr = h("tr");
    const lbl = h("td", "lbl");
    lbl.append(document.createTextNode((lang === "fa" ? fa : en) + " "), h("span", "sym", sym));
    tr.append(lbl);
    for (let s = 1; s <= 6; s++) tr.append(heatCell(cells && cells[s], true, s === chartStage));
    const best = bestStage(cells);
    tr.append(h("td", "num", best ? t.num(best) : "–"), h("td", "num", t.num(chartStage)));
    if (best) {
      const d = stageDist(best, chartStage);
      const k = d === 0 ? "yes" : d === 1 ? "near" : "no";
      tally[k]++; counted++;
      tr.append(h("td", "agree " + k, t.agreeLbl[k]));
    } else tr.append(h("td", null, "–"));
    // Stability: best stage in 1993-2009 vs. 2010-today
    const ba = bt.halves ? bestStage(bt.halves.a[sym]) : null;
    const bb = bt.halves ? bestStage(bt.halves.b[sym]) : null;
    if (ba && bb) {
      const d = stageDist(ba, bb);
      const k = d === 0 ? "yes" : d === 1 ? "near" : "no";
      if (d <= 1) stableYes++;
      stableN++;
      const td = h("td", "agree " + k, t.agreeLbl[k]);
      td.title = t.stableTip(t.num(ba), t.num(bb));
      tr.append(td);
    } else tr.append(h("td", null, "–"));
    tb.append(tr);
  });
  document.getElementById("t-heat-hint").textContent = t.heatHint;
  document.getElementById("bt-verdict").textContent = t.verdict(t.num(tally.yes), t.num(tally.near), t.num(counted))
    + (stableN ? t.stableVerdict(t.num(stableYes), t.num(stableN)) : "");

  // Asset-class heatmap, outlined where Pring's model says overweight
  document.getElementById("t-bt-cls").textContent = t.btClsTitle;
  const tc = document.getElementById("heat-cls");
  tc.replaceChildren(heatHead(bt, t.colAsset, []));
  CLASS_KEYS.forEach((k) => {
    const cells = bt.classes[k];
    if (!cells) return;
    const tr = h("tr");
    tr.append(h("td", "lbl", t.classNames[k]));
    for (let s = 1; s <= 6; s++) tr.append(heatCell(cells[s], false, TILT[s - 1][k] === "ow"));
    tc.append(tr);
  });
  document.getElementById("t-cls-hint").textContent = t.clsHint;
  document.getElementById("bt-note").textContent = t.btNote;
}

// ---- Economic check (FRED) ----
const ECON_KEYS = ["curve", "unemployment", "credit", "production"];
const stageSide = (s) => (s == null ? null : [3, 4, 5].includes(s) ? "exp" : "con");
const scoreSide = (score) => (score >= 2 ? "exp" : score <= -2 ? "con" : null);
const signed = (v, d = 2) => (v > 0 ? "+" : v < 0 ? "−" : "") + T[lang].fmt(Math.abs(v), d);

function miniLine(values, zero) {
  const w = 300, hh = 54, pad = 4;
  let lo = Math.min(...values), hi = Math.max(...values);
  if (zero != null) { lo = Math.min(lo, zero); hi = Math.max(hi, zero); }
  const x = (i) => pad + (i / Math.max(values.length - 1, 1)) * (w - 2 * pad);
  const y = (v) => pad + (1 - (v - lo) / (hi - lo || 1)) * (hh - 2 * pad);
  const svg = el("svg", { class: "mini", viewBox: `0 0 ${w} ${hh}`, preserveAspectRatio: "none", "aria-hidden": "true" });
  if (zero != null) svg.append(el("line", { x1: 0, x2: w, y1: y(zero), y2: y(zero), stroke: "var(--dash)", "stroke-dasharray": "3 3", "vector-effect": "non-scaling-stroke" }));
  svg.append(el("path", { d: values.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join(""), fill: "none", stroke: "var(--blue)", "stroke-width": 2, "vector-effect": "non-scaling-stroke" }));
  return svg;
}

function econAgree() {
  const M = ALL && ALL.macro;
  if (!M) return null;
  const side = scoreSide(M.score);
  const st = liveStageIdx != null ? liveStageIdx + 1 : null;
  if (!side || st == null) return { M, side, agree: null };
  return { M, side, agree: side === stageSide(st) };
}

function drawEcon() {
  const t = T[lang];
  const sec = document.getElementById("econ-sec");
  const M = ALL && ALL.macro;
  if (!M) { sec.hidden = true; return; }
  sec.hidden = false;
  document.getElementById("t-econ").textContent = t.econTitle;
  document.getElementById("t-econ-kicker").textContent = (M.stale ? t.econStale + " " : "") + t.econKicker;
  const sc = document.getElementById("econ-score");
  sc.className = "conv " + (M.score >= 2 ? "high" : M.score <= -2 ? "low" : "mid");
  sc.textContent = t.econScore(signed(M.score, 0));

  const grid = document.getElementById("econ-grid");
  grid.replaceChildren();
  ECON_KEYS.forEach((k) => {
    const ind = M.indicators[k];
    if (!ind) return;
    const b = h("div", "nm-box");
    b.append(h("h4", null, t.econNames[k]));
    const unit = k === "production" ? "" : "%";
    b.append(h("div", "val", t.fmt(ind.value, k === "production" ? 1 : 2) + unit));
    b.append(h("span", "vote " + (ind.vote > 0 ? "p" : ind.vote < 0 ? "n" : "z"), t.econVote[String(ind.vote)]));
    let detail = "";
    if (k === "curve") detail = t.econDetail.curve(ind.value);
    else if (k === "unemployment") detail = t.econDetail.unemployment(t.fmt(ind.detail, 2));
    else if (k === "credit") detail = t.econDetail.credit(t.fmt(Math.abs(ind.detail), 2), ind.detail > 0);
    else detail = t.econDetail.production(signed(ind.detail));
    b.append(h("p", null, detail));
    const sp = M.spark && M.spark[k];
    if (sp && sp.values.length > 1) b.append(miniLine(sp.values, k === "curve" ? 0 : null));
    b.append(h("p", "muted num", `${ind.series} · ${t.date(ind.date)}`));
    grid.append(b);
  });

  const ea = econAgree();
  const st = liveStageIdx != null ? liveStageIdx + 1 : null;
  document.getElementById("econ-verdict").textContent = t.econVerdict(
    signed(M.score, 0), ea.side ? t.econSide[ea.side] : "", st ? stageLabel(st - 1) : t.statMixed, ea.agree);

  document.getElementById("t-econ-hist").textContent = t.econHist;
  const bars = document.getElementById("econ-bars");
  bars.replaceChildren();
  (M.history || []).forEach((r) => {
    const s = h("span");
    const mag = Math.abs(r.score);
    s.style.height = `${8 + mag * 13}px`;
    s.style.background = r.score > 0 ? "var(--up)" : r.score < 0 ? "var(--down)" : "var(--dash)";
    s.style.alignSelf = "center";
    s.title = `${r.month}: ${signed(r.score, 0)}`;
    bars.append(s);
  });
  document.getElementById("econ-note").textContent = t.econNote;
}

// ---- Strategy test ----
const STRAT_KEYS = ["pring", "trend", "spy", "sixty", "equal"];
const STRAT_COLORS = { pring: "var(--accent)", trend: "var(--blue)", spy: "var(--ink)", sixty: "var(--teal)", equal: "var(--muted)" };
const yr = (s) => (lang === "fa" ? Number(s.slice(0, 4)).toLocaleString("fa-IR", { useGrouping: false }) : s.slice(0, 4));

function drawEquity(S) {
  const t = T[lang];
  const svg = document.getElementById("equity");
  svg.replaceChildren();
  svg.style.fontFamily = lang === "fa" ? "var(--font-fa)" : "var(--font-en)";
  const L = 70, R = 800, TOP = 16, BOT = 290;
  const dates = S.curves.dates;
  const all = STRAT_KEYS.flatMap((k) => S.curves[k]);
  const lo = Math.log(Math.min(1, ...all)), hi = Math.log(Math.max(...all));
  const x = (i) => L + (i / (dates.length - 1)) * (R - L);
  const y = (v) => BOT - ((Math.log(v) - lo) / (hi - lo || 1)) * (BOT - TOP);
  // Grid: powers of two, labelled as what $1 grew to
  for (let g = 1; g <= Math.exp(hi) * 1.01; g *= 2) {
    svg.append(el("line", { x1: L, x2: R, y1: y(g), y2: y(g), stroke: "var(--line)", "stroke-width": 1 }));
    svg.append(el("text", { x: L - 8, y: y(g) + 4, "text-anchor": "end", "font-size": 11, fill: "var(--muted)" }, "$" + t.num(g)));
  }
  // Year ticks every 5 years
  dates.forEach((d, i) => {
    if (d.endsWith("-01") && +d.slice(0, 4) % 5 === 0) {
      svg.append(el("line", { x1: x(i), x2: x(i), y1: BOT, y2: BOT + 5, stroke: "var(--muted)" }));
      svg.append(el("text", { x: x(i), y: BOT + 20, "text-anchor": "middle", "font-size": 11, fill: "var(--muted)" }, yr(d)));
    }
  });
  // Shade the stability split
  const si = dates.findIndex((d) => d >= (ALL.backtest.split || "2010-01"));
  if (si > 0) svg.append(el("line", { x1: x(si), x2: x(si), y1: TOP, y2: BOT, stroke: "var(--dash)", "stroke-dasharray": "4 4" }));
  [...STRAT_KEYS].reverse().forEach((k) => {
    const v = S.curves[k];
    const d = v.map((val, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(val).toFixed(1)).join("");
    svg.append(el("path", { d, fill: "none", stroke: STRAT_COLORS[k], "stroke-width": k === "pring" ? 3 : 1.6, "stroke-linejoin": "round", opacity: k === "pring" ? 1 : 0.85 }));
  });
  const lg = document.getElementById("equity-legend");
  lg.replaceChildren();
  STRAT_KEYS.forEach((k) => {
    const s = h("span");
    const i = h("i");
    i.style.borderTopColor = STRAT_COLORS[k];
    s.append(i, document.createTextNode(t.stratNames[k]));
    lg.append(s);
  });
}

function drawStrategy() {
  const t = T[lang];
  const sec = document.getElementById("strat-sec");
  const bt = btData();
  const S = bt && bt.strategy;
  if (!S) { sec.hidden = true; return; }
  sec.hidden = false;
  const pctf = (v) => (v == null ? "–" : signed(v, 1) + "%");
  document.getElementById("t-strat").textContent = t.stratTitle;
  document.getElementById("t-strat-kicker").textContent = t.stratKicker(t.num(+period), t.ruleOpt[rule]);

  // Weights per stage
  const wt = document.getElementById("strat-weights");
  wt.replaceChildren();
  const hr = h("tr");
  hr.append(h("th", null, ""));
  STAGES.forEach((_, i) => hr.append(h("th", i === sel ? "on" : "", stageLabel(i))));
  wt.append(hr);
  ["cash", "bonds", "stocks", "commodities"].forEach((a) => {
    const tr = h("tr");
    tr.append(h("td", "lbl", t.tiltAssets[a]));
    S.weights.forEach((w) => {
      const v = Math.round(w[a] * 100);
      const td = h("td", null, v ? t.num(v) + "%" : "–");
      td.style.background = v ? `color-mix(in srgb, var(--blue) ${Math.round(4 + v * 0.35)}%, transparent)` : "";
      tr.append(td);
    });
    wt.append(tr);
  });

  drawEquity(S);

  const st = S.stats;
  const P = st.pring, SP = st.spy;
  const better = P.sharpe > SP.sharpe;
  const tag = document.getElementById("strat-tag");
  const tk = better ? "better" : P.mdd > SP.mdd && P.cagr < SP.cagr ? "mixed" : "worse";
  tag.className = "conv " + (tk === "better" ? "high" : tk === "mixed" ? "mid" : "low");
  tag.textContent = t.stratTag[tk];
  document.getElementById("strat-verdict").textContent = t.stratVerdict({
    cagr: t.fmt(P.cagr, 1), spyCagr: t.fmt(SP.cagr, 1), mdd: t.fmt(P.mdd, 1), spyMdd: t.fmt(SP.mdd, 1),
    sharpe: t.fmt(P.sharpe, 2), spySharpe: t.fmt(SP.sharpe, 2), sixtySharpe: t.fmt(st.sixty.sharpe, 2),
    trendBetter: st.trend.sharpe > P.sharpe, trendSharpe: t.fmt(st.trend.sharpe, 2),
  });

  const swatch = (k) => { const f = document.createDocumentFragment(); const i = h("i", "sw"); i.style.borderTopColor = STRAT_COLORS[k]; f.append(i, document.createTextNode(t.stratNames[k])); return f; };
  document.getElementById("t-strat-stats").textContent = t.statsTitle(yr(S.start), yr(S.end));
  statTable("strat-stats", t.statCols, STRAT_KEYS.filter((k) => st[k]).map((k) => [k === "pring" ? "me" : "", [
    swatch(k), pctf(st[k].cagr), t.fmt(st[k].vol, 1) + "%", t.fmt(st[k].mdd, 1) + "%", t.fmt(st[k].sharpe, 2), "$" + t.fmt(st[k].growth, 2),
  ]]));

  const split = ALL.backtest.split || "2010-01";
  const aLbl = `${yr(S.start)}–${yr(String(+split.slice(0, 4) - 1))}`, bLbl = `${yr(split)}–${yr(S.end)}`;
  document.getElementById("t-strat-halves").textContent = t.halvesTitle;
  document.getElementById("t-strat-halves-hint").textContent = t.halvesHint(aLbl, bLbl);
  const HA = S.halves.a, HB = S.halves.b;
  statTable("strat-halves", t.halvesCols(aLbl, bLbl), STRAT_KEYS.filter((k) => HA[k] && HB[k]).map((k) => [k === "pring" ? "me" : "", [
    swatch(k), pctf(HA[k].cagr), t.fmt(HA[k].mdd, 1) + "%", pctf(HB[k].cagr), t.fmt(HB[k].mdd, 1) + "%",
  ]]));

  document.getElementById("t-strat-rules").textContent = t.rulesTitle;
  document.getElementById("t-strat-rules-hint").textContent = t.rulesHint(t.num(+period));
  statTable("strat-rules", t.rulesCols, RULE_KEYS.map((r) => {
    const R = ALL.backtest.periods[PK(period, r)];
    const s = R && R.strategy;
    if (!s) return ["", [t.ruleOpt[r], "–", "–", "–", "–"]];
    const p = s.stats.pring;
    return [r === rule ? "me" : "", [t.ruleOpt[r], pctf(p.cagr), t.fmt(p.mdd, 1) + "%", t.fmt(p.sharpe, 2), t.num(s.turnover) + "%"]];
  }));
  document.getElementById("strat-note").textContent = t.stratNote;
}

// ---- "What happens next": history of what followed the selected stage ----
function drawAfter() {
  const t = T[lang];
  const sec = document.getElementById("after-sec");
  const B = ALL && ALL.backtest;
  const P = B && (B.periods[PK(period)] || B.periods[period]);
  const A = P && P.after;
  if (!A) { sec.hidden = true; return; }
  sec.hidden = false;
  const escH = (x) => String(x).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const idx = sel ?? focusIdx();
  const st = String(idx + 1);
  const yr = (m) => (lang === "fa" ? Number(m.slice(0, 4)).toLocaleString("fa-IR", { useGrouping: false }) : m.slice(0, 4));
  const sg = (v) => `<span class="ltr num">${(v > 0 ? "+" : v < 0 ? "−" : "") + t.fmt(Math.abs(v), 1)}%</span>`;

  document.getElementById("t-after").textContent = t.afterT;
  document.getElementById("t-after-sub").textContent = t.afterSub(stageLabel(idx), yr(P.start || "1994"), yr(P.end || "2026"));
  document.getElementById("after-pick").innerHTML = STAGES.map((_, i) =>
    `<button type="button" data-stage="${i}" aria-pressed="${i === idx}" class="${i === liveStageIdx ? "live" : ""}" aria-label="${escH(stageLabel(i))}">${t.num(i + 1)}</button>`).join("");

  // Small-sample warning
  const months = (P.counts && P.counts[st]) || 0;
  const eps = (A.durations[st] && A.durations[st].n) || 0;
  const warn = document.getElementById("after-warn");
  const small = months < 24 || eps < 3;
  warn.hidden = !small;
  warn.textContent = small ? t.afterWarn(t.num(months), t.num(Math.max(eps, liveStageIdx === idx ? 1 : 0))) : "";

  // Returns grid
  document.getElementById("t-after-ret").textContent = t.afterRetT;
  const H = A.horizons || [3, 6, 12];
  let g = t.afterCols.map((c) => `<span class="hd">${escH(c)}</span>`).join("");
  ["stocks", "bonds", "commodities", "gold"].forEach((k) => {
    g += `<span class="nm">${escH(t.afterAssets[k])}</span>`;
    H.forEach((h) => {
      const c = A.forward[st] && A.forward[st][k] && A.forward[st][k][String(h)];
      const base = A.forward.all[k] && A.forward.all[k][String(h)];
      if (!c) { g += `<span class="acell none">${escH(t.afterNone)}</span>`; return; }
      const better = base ? c.avg - base.avg : 0;
      g += `<span class="acell${small ? " faded" : ""}"><b class="${c.avg >= 0 ? "pos" : "neg"}">${sg(c.avg)}</b>
        <small>${escH(t.afterPos(t.num(c.pos)))}</small>
        ${base ? `<small class="base ${better >= 0 ? "pos" : "neg"}">${t.afterAll("")}${sg(base.avg)}</small>` : ""}</span>`;
    });
  });
  document.getElementById("after-ret").innerHTML = g;

  // Duration + next stage
  const facts = document.getElementById("after-facts");
  const D2 = A.durations[st];
  const Hs = DATA ? DATA.history || [] : [];
  let since = 0;
  if (liveStageIdx === idx) for (let i = Hs.length - 1; i >= 0 && Hs[i].stage === idx + 1; i--) since++;
  let html = `<div class="after-box"><h4>${escH(t.afterDurT)}</h4>`;
  if (D2) {
    html += `<p>${escH(t.afterDur(t.fmt(D2.med, D2.med % 1 ? 1 : 0), t.fmt(D2.avg, 1), t.num(D2.n)))}</p>`;
    const pct = liveStageIdx === idx ? Math.min(100, Math.round((Math.max(since, 1) / Math.max(D2.med, 1)) * 100)) : 0;
    html += `<div class="meter"><i style="width:${pct}%"></i></div>`;
  } else html += `<p class="muted">${escH(t.afterNextNone)}</p>`;
  html += `<p class="muted">${escH(liveStageIdx === idx ? t.afterNow(t.num(Math.max(since, 1))) : t.afterNowOther)}</p></div>`;

  const T2 = A.transitions[st];
  html += `<div class="after-box"><h4>${escH(t.afterNextT)}</h4>`;
  if (T2) {
    const total = Object.values(T2).reduce((x, y) => x + y, 0);
    Object.entries(T2).sort((x, y) => y[1] - x[1]).forEach(([s2, n]) => {
      const share = Math.round((n / total) * 100);
      html += `<div class="nx-row"><span>${escH(stageLabel(+s2 - 1))}</span><div class="nx-bar"><i style="width:${share}%"></i></div><b class="num">${t.num(share)}%</b></div>`;
    });
    html += `<p class="muted">${escH(t.afterNextPring(stageLabel((idx + 1) % 6)))}</p>`;
  } else html += `<p class="muted">${escH(t.afterNextNone)}</p>`;
  facts.innerHTML = html + "</div>";
  document.getElementById("after-note").textContent = t.afterNote;
}
document.getElementById("after-pick").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-stage]");
  if (b) { select(+b.dataset.stage); document.querySelector(`#after-pick [data-stage="${b.dataset.stage}"]`).focus(); }
});

// ---- Deep buy meter: fear (VIX), price (S&P 500 below its high), cycle filter, and the history behind it ----
// Deep buy meter level, shared by the Deep buy section and the Today card
function deepState(D = DATA) {
  const L = ALL && ALL.deep;
  if (!L || !L.vix || !L.spx || !D) return null;
  // 1. Fear: the higher of today's VIX and its highest close of the last month
  const fearV = Math.max(L.vix.now, L.vix.peak || 0);
  const fearLv = fearV >= 40 ? 3 : fearV >= 30 ? 2 : fearV >= 20 ? 1 : 0;
  // 2. Price: how far the S&P 500 is below its all-time high
  const drop = Math.max(0, -L.spx.drop);
  const dropLv = drop >= 30 ? 3 : drop >= 20 ? 2 : drop >= 10 ? 1 : 0;
  // 3. Cycle: the reading the page is showing
  const stg = D.stage;
  const Hs = D.history || [];
  let since = 0;
  if (stg === 2) for (let i = Hs.length - 1; i >= 0 && Hs[i].stage === 2; i--) since++;
  const cyc = stg === 2 && since <= 2 ? "fresh" : [2, 3, 4].includes(stg) ? "healthy" : stg === 5 ? "late" : stg ? "down" : "mixed";
  let lv = 0, wait = false;
  if (cyc === "fresh" || (fearLv === 3 && cyc === "healthy")) lv = 3;
  else if (dropLv === 3) lv = 2;
  else if (fearLv === 3 && (cyc === "down" || cyc === "mixed")) { lv = 1; wait = true; }
  else if (fearLv >= 2 || dropLv >= 1 || stg === 1) lv = 1;
  return { L, fearV, fearLv, drop, dropLv, stg, since, cyc, lv, wait };
}

function drawDeep() {
  const t = T[lang];
  const sec = document.getElementById("deep-sec");
  const L = ALL && ALL.deep;
  if (!L || !L.vix || !L.spx || !DATA) { sec.hidden = true; return; }
  sec.hidden = false;
  const S = ALL.backtest && ALL.backtest.deepbuy;
  const n1 = (v, d = 1) => `<span class="ltr num">${t.fmt(v, d)}</span>`;
  const pc = (v, d = 1) => `<span class="ltr num">${(v > 0 ? "+" : v < 0 ? "−" : "") + t.fmt(Math.abs(v), d)}%</span>`;
  const upK = (s) => Math.round((s.pos * s.n) / 100);

  const { fearV, fearLv, drop, dropLv, stg, since, cyc, lv, wait } = deepState();
  document.getElementById("t-deep").textContent = t.deepT;
  document.getElementById("t-deep-sub").textContent = t.deepSub(t.num(Number(S ? S.from : 1990)).replace(/[٬,]/g, ""));
  const pill = document.getElementById("deep-pill");
  pill.textContent = t.deepLevels[lv];
  pill.className = "deep-pill lv" + lv;
  const stale = document.getElementById("deep-stale");
  stale.hidden = !L.stale;
  stale.textContent = L.stale ? t.deepStale : "";
  document.getElementById("deep-zones").innerHTML = t.deepLevels.map((x, i) =>
    `<div class="z${i}${i === lv ? " on" : ""}"${i === lv ? ' aria-current="true"' : ""}><i></i>${x}</div>`).join("");
  document.getElementById("deep-verdict").textContent = wait ? t.deepWait : t.deepVerdict[lv];

  // VIX sparkline with the 30 and 40 lines
  const sv = (L.vix.spark && L.vix.spark.v) || [];
  let spark = "";
  if (sv.length > 1) {
    const top = Math.max(45, ...sv) * 1.05, W = 300, H = 56;
    const y = (v) => (H - (v / top) * H).toFixed(1);
    const pts = sv.map((v, i) => `${((i / (sv.length - 1)) * W).toFixed(1)},${y(v)}`).join(" ");
    spark = `<svg class="deep-spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
      <line x1="0" x2="${W}" y1="${y(30)}" y2="${y(30)}" stroke="var(--warn)" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>
      <line x1="0" x2="${W}" y1="${y(40)}" y2="${y(40)}" stroke="var(--up)" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>
      <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>
      <span class="deep-spark-l">${t.deepSpark}</span>`;
  }
  let cycTxt;
  const sl = stg ? stageLabel(stg - 1) : "";
  if (cyc === "fresh") cycTxt = t.deepFresh(t.num(since));
  else if (cyc === "healthy") cycTxt = t.deepHealthy(sl);
  else if (cyc === "late") cycTxt = t.deepLate(sl);
  else if (cyc === "down") cycTxt = t.deepDown(sl);
  else cycTxt = t.deepMixedTxt;
  if (stg === 1 && DATA.assets && DATA.assets.stocks) {
    const g = DATA.assets.stocks.gap;
    const need = Math.max(0, rule === "band" ? 2 - g : -g);
    cycTxt += " " + t.deepNeed(pc(need, 1));
  }
  const cycLvCls = { fresh: 3, healthy: 2, late: 1, down: 0, mixed: 0 }[cyc];
  const box = (title, cls, label, body) => `<div class="after-box"><h4>${title}</h4><span class="dlv lv${cls}">${label}</span><p>${body}</p></div>`;
  document.getElementById("deep-checks").innerHTML =
    box(t.deepFearT, fearLv, t.deepFearLv[fearLv], t.deepFear(n1(L.vix.now), n1(L.vix.peak), t.date(L.vix.peakDate))) .replace("</p></div>", `</p>${spark}</div>`) +
    box(t.deepPriceT, dropLv, t.deepPriceLv[dropLv], t.deepPrice(`<span class="ltr num">${t.fmt(drop, 1)}%</span>`, t.date(L.spx.highDate))) +
    box(t.deepCycleT, cycLvCls, t.deepCycleLv[cyc], cycTxt);

  // History behind the meter
  const ev = document.querySelector("#deep-sec .deep-ev");
  ev.hidden = !S;
  if (S) {
    document.getElementById("t-deep-ev").textContent = t.deepEvT;
    let rows = `<tr>${t.deepEvCols.map((c) => `<th>${c}</th>`).join("")}</tr>`;
    S.events.forEach((e) => {
      const stCell = !e.known ? "–" : e.stage ? `<b>${t.num(e.stage)}</b>` : t.deepMixed;
      rows += `<tr class="${e.r12 == null ? "" : e.r12 > 0 ? "ok" : "bad"}">
        <td>${new Date(e.date + "T12:00:00").toLocaleDateString(lang === "fa" ? "fa-IR" : "en-US", { year: "numeric", month: "short" })}</td><td>${n1(e.vix)}</td>
        <td><b class="${e.r12 == null ? "" : e.r12 >= 0 ? "pos" : "neg"}">${e.r12 == null ? "–" : pc(e.r12)}</b></td>
        <td>${e.lower < 0 ? pc(e.lower) : pc(0)}</td><td>${stCell}</td></tr>`;
    });
    document.getElementById("deep-tab").innerHTML = rows;
    const sum = [];
    if (S.healthy.r12) sum.push(`<span>${t.deepEvSum(t.deepEvHealthy, pc(S.healthy.r12.avg), t.num(upK(S.healthy.r12)), t.num(S.healthy.r12.n))}</span>`);
    if (S.other.r12) sum.push(`<span>${t.deepEvSum(t.deepEvOther, pc(S.other.r12.avg), t.num(upK(S.other.r12)), t.num(S.other.r12.n))}</span>`);
    document.getElementById("deep-sum").innerHTML = sum.join("");
    document.getElementById("t-deep-facts").textContent = t.deepFactsT;
    const f = [];
    const s2 = S.stage2First && S.stage2First.r12;
    if (s2) f.push(t.deepFact2(pc(s2.avg), t.num(upK(s2)), t.num(s2.n)));
    if (S.calmAfter) f.push(t.deepFactCalm(pc(S.calmAfter.avg), t.num(upK(S.calmAfter)), t.num(S.calmAfter.n)));
    const d30 = S.drops && S.drops[3] && S.drops[3].r12;
    if (d30) f.push(t.deepFactDrop(pc(d30.avg), t.num(d30.pos)));
    if (S.allMonths) f.push(t.deepFactAll(pc(S.allMonths.avg), t.num(S.allMonths.pos)));
    document.getElementById("deep-facts").innerHTML = f.map((x) => `<li>${x}</li>`).join("");
  }
  document.getElementById("deep-note").textContent = t.deepNote;
}

function select(i, focus) {
  sel = i;
  drawFrame(); drawNext(); drawAfter(); drawChart(); drawDetail(); drawWatch(); drawBacktest(); drawStrategy(); drawMatrix();
  if (focus) document.getElementById("col-" + i).focus();
}

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = t.dir;
  document.body.classList.toggle("fa", lang === "fa");
  document.title = t.title;
  document.getElementById("t-title").textContent = t.title;
  document.getElementById("t-sub").textContent = t.sub;
  document.getElementById("t-check").textContent = t.check;
  document.getElementById("t-hint").textContent = t.hint;
  document.getElementById("t-matrix").textContent = t.matrix;
  document.getElementById("t-note").textContent = t.note;
  document.getElementById("lang-fa").setAttribute("aria-pressed", String(lang === "fa"));
  document.getElementById("lang-en").setAttribute("aria-pressed", String(lang === "en"));
  drawLive(); drawFrame(); drawNext(); drawAfter(); drawDeep(); drawEcon(); drawChart(); drawDetail(); drawChecker(); drawWatch(); drawBacktest(); drawStrategy(); drawHistory(); drawMatrix();
}

function setPeriod(p, focusId) {
  period = p;
  try { localStorage.setItem("cycle-period", p); } catch (e) {}
  loadPeriod();
  sel = liveStageIdx ?? (DATA.nearest.length ? DATA.nearest[0] - 1 : sel);
  trend = liveTrend();
  render();
  if (focusId) document.getElementById(focusId).focus();
}

function setRule(r) {
  rule = r;
  try { localStorage.setItem("cycle-rule2", r); } catch (e) {}
  loadPeriod();
  sel = liveStageIdx ?? (DATA.nearest.length ? DATA.nearest[0] - 1 : sel);
  trend = liveTrend();
  render();
  document.getElementById("rule-" + r).focus();
}

function setLang(l) {
  lang = l;
  try { localStorage.setItem("cycle-lang", l); } catch (e) {}
  render();
}
document.getElementById("lang-fa").addEventListener("click", () => setLang("fa"));
document.getElementById("lang-en").addEventListener("click", () => setLang("en"));
render();
// Installable app: offline copy when served from the website (not when opened as a local file)
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
