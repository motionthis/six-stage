<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ff9f1a">
<meta name="description" content="Live six-stage business cycle reading for US bonds, stocks and commodities.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Six-Stage">
<title>Six-Stage Business Cycle · Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: floating white sidebar card and top bar on a pale grey canvas; white rounded cards, a row of gradient tiles for live prices, orange marks the current stage and purple marks your selection. */
:root {
  --side: #ffffff;
  --side-ink: #2b2f3f;
  --side-muted: #6c7285;
  --side-hover: #f5f6fb;
  --bg: #f1f3f9;
  --surface: #ffffff;
  --tint: #f5f6fa;
  --track: #eef0f6;
  --ink: #2b2f3f;
  --muted: #8a90a3;
  --line: #edeff5;
  --dash: #dde1ea;
  --accent: #ff9f1a;
  --accent-soft: rgba(255, 159, 26, 0.13);
  --blue: #7a5af5;
  --sky: #34a2f6;
  --teal: #22c3b2;
  --amber: #ffb547;
  --pink: #ec4b88;
  --up: #12a596;
  --up-soft: rgba(34, 195, 178, 0.14);
  --down: #ef4360;
  --down-soft: rgba(239, 67, 96, 0.1);
  --warn: #d48806;
  --warn-soft: rgba(255, 181, 71, 0.18);
  --sel: rgba(43, 47, 63, 0.07);
  --warm-soft: rgba(196, 150, 80, 0.14);   /* contraction half of the cycle (stages 1-3) */
  --cool-soft: rgba(122, 90, 245, 0.1);    /* expansion half (stages 4-6) */
  --half-c-ink: #93652a;
  --half-e-ink: #6450c4;
  --pick: #2b2f3f;                           /* your selection */
  --pick-soft: rgba(43, 47, 63, 0.07);
  --curve: #2b2f3f;
  --g-purple: linear-gradient(135deg, #8c66f8 0%, #5a3bef 100%);
  --g-blue: linear-gradient(135deg, #3db3f9 0%, #2b62ee 100%);
  --g-teal: linear-gradient(135deg, #43d9c3 0%, #19a8ad 100%);
  --g-orange: linear-gradient(135deg, #ffc04a 0%, #ff7c4c 100%);
  --g-pink: linear-gradient(90deg, #2b2f3f 0%, #474d66 100%);
  --g-up: linear-gradient(135deg, #3fd3bf 0%, #16a6a3 100%);
  --g-down: linear-gradient(135deg, #ff6b8b 0%, #ec3f5c 100%);
  --shadow: 0 2px 6px rgba(43, 47, 63, 0.04), 0 12px 32px rgba(43, 47, 63, 0.06);
  --font-fa: "Vazirmatn", "Tahoma", system-ui, sans-serif;
  --font-en: "Nunito", "Vazirmatn", system-ui, sans-serif;
  --font-num: "Nunito", "Vazirmatn", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --side: #1a1f2c; --side-ink: #e8ebf3; --side-muted: #959cb0; --side-hover: #232a3a;
    --bg: #11151f; --surface: #1a1f2c; --tint: #222938; --track: #252c3c;
    --ink: #e8ebf3; --muted: #959cb0; --line: #262d3c; --dash: #343c4d;
    --accent: #ffad3b; --accent-soft: rgba(255, 173, 59, 0.15);
    --blue: #9b83ff; --sky: #5bb5f8; --teal: #3fd3bf; --amber: #ffc163;
    --up: #45d3bf; --up-soft: rgba(63, 211, 191, 0.14); --down: #ff6f86; --down-soft: rgba(255, 111, 134, 0.13);
    --warn: #ffc163; --warn-soft: rgba(255, 193, 99, 0.15); --sel: rgba(232, 235, 243, 0.08); --pick: #e8ebf3; --pick-soft: rgba(232, 235, 243, 0.08); --half-c-ink: #e2bd84; --half-e-ink: #b9a8ff;
    --warm-soft: rgba(214, 170, 100, 0.14); --cool-soft: rgba(155, 131, 255, 0.13); --curve: #e8ebf3;
    --shadow: none;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-en); font-size: 15px; line-height: 1.6; }
body.fa { font-family: var(--font-fa); }
button { font: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, .mono { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* App frame */
.app { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 28px; min-height: 100vh; padding: 24px; }
.side {
  position: sticky; top: 24px; height: calc(100vh - 48px); display: flex; flex-direction: column; gap: 24px;
  padding: 30px 0 24px; background: var(--side); color: var(--side-ink); border-radius: 20px; box-shadow: var(--shadow); overflow-y: auto;
}
.main { min-width: 0; display: grid; gap: 24px; align-content: start; padding-bottom: 32px; }
.brand { display: flex; align-items: center; gap: 12px; font-size: 21px; font-weight: 800; padding-inline: 30px; white-space: nowrap; }
body.fa .brand { font-size: 18px; }
.brand .logo { width: 38px; height: 38px; border-radius: 50%; background: var(--g-orange); color: #fff; display: grid; place-items: center; flex: none; box-shadow: 0 6px 14px rgba(255, 140, 50, 0.3); }
.brand svg { width: 22px; height: 22px; }
.who { display: grid; justify-items: center; gap: 2px; text-align: center; margin: 4px 24px 0; padding: 18px 12px; border-radius: 18px; background: var(--tint); }
.badge {
  width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center; color: #fff;
  background: var(--g-orange); box-shadow: 0 10px 22px rgba(255, 140, 50, 0.3);
  font-family: var(--font-num); font-size: 32px; font-weight: 800; margin-bottom: 10px;
}
.who .nm { font-size: 16px; font-weight: 700; }
.who .sm { font-size: 12.5px; color: var(--side-muted); }
nav { display: grid; gap: 2px; }
nav a {
  display: flex; align-items: center; gap: 16px; padding: 13px 30px; color: var(--side-ink); text-decoration: none; font-size: 15.5px; font-weight: 600;
  border-inline-start: 4px solid transparent;
}
nav a svg { width: 19px; height: 19px; flex: none; color: var(--side-muted); }
nav a:hover { background: var(--side-hover); }
nav a.on { color: var(--accent); border-inline-start-color: var(--accent); font-weight: 800; }
nav a.on svg { color: var(--accent); }
.side-foot { margin-top: auto; display: flex; gap: 10px; justify-content: center; }
.side-foot button {
  min-width: 52px; height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); color: var(--side-muted); cursor: pointer; font-size: 13px; font-weight: 700;
}
.side-foot button[aria-pressed="true"] { background: var(--accent-soft); border-color: transparent; color: var(--accent); }

@media (max-width: 960px) {
  .app { grid-template-columns: 1fr; padding: 12px; gap: 16px; }
  .side { position: static; height: auto; padding: 16px; gap: 12px; flex-direction: row; flex-wrap: wrap; align-items: center; }
  .brand { padding-inline: 4px; }
  .who { grid-template-columns: auto auto; justify-items: start; text-align: start; column-gap: 12px; margin: 0; padding: 8px 12px; background: transparent; }
  .who .badge { width: 46px; height: 46px; font-size: 20px; margin: 0; grid-row: span 3; }
  nav { order: 5; width: 100%; grid-auto-flow: column; overflow-x: auto; gap: 4px; }
  nav a { padding: 8px 12px; white-space: nowrap; border-inline-start: 0; border-bottom: 3px solid transparent; }
  nav a.on { border-bottom-color: var(--accent); }
  nav a svg { display: none; }
  .side-foot { margin: 0; margin-inline-start: auto; }
}

/* Top bar */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; background: var(--surface); border-radius: 18px; padding: 14px 22px; box-shadow: var(--shadow); }
.pillbox { display: inline-flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.pillbox > span { color: var(--muted); font-size: 14px; font-weight: 600; }
.cta {
  display: inline-flex; align-items: center; gap: 10px; border: 0; border-radius: 999px; padding: 13px 26px;
  background: var(--g-pink); color: #fff; font-weight: 700; font-size: 13.5px; cursor: pointer; position: relative;
  box-shadow: 0 10px 22px rgba(43, 47, 63, 0.22);
}
.cta svg { width: 18px; height: 18px; }
.cta .count {
  position: absolute; top: -7px; inset-inline-end: -4px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px;
  background: var(--down); color: #fff; font-size: 12px; display: grid; place-items: center; border: 2px solid var(--surface);
}
.head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; padding-inline: 4px; }
.head h1 { margin: 0; font-size: clamp(1.5rem, 2.8vw, 2rem); line-height: 1.2; font-weight: 800; letter-spacing: -0.01em; text-wrap: balance; }
.date { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; color: var(--muted); }
.date svg { width: 20px; height: 20px; color: var(--muted); }
.sub { margin: -14px 0 0; padding-inline: 4px; color: var(--muted); max-width: 70ch; }

/* Cards */
.card { background: var(--surface); border-radius: 28px; padding: 26px; box-shadow: var(--shadow); min-width: 0; }
.card-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px 16px; margin-bottom: 16px; }
.card-top h2 { margin: 0; font-size: 1.1rem; font-weight: 700; }
.card > h2, .h2 { margin: 0 0 16px; font-size: 1.1rem; font-weight: 700; }
.kicker { font-size: 13px; color: var(--muted); margin: -10px 0 16px; max-width: 70ch; }

/* Segmented controls */
.seg { display: inline-flex; gap: 4px; background: var(--track); border-radius: 14px; padding: 4px; }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 7px 14px; border-radius: 11px; cursor: pointer; font-size: 13px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 2px 6px rgba(31,43,59,.08); }
.seg button.up[aria-pressed="true"] { background: var(--up); color: #fff; }
.seg button.down[aria-pressed="true"] { background: var(--down); color: #fff; }

/* Summary row */
.stats { display: grid; grid-template-columns: 1.1fr 1fr 1fr; padding: 28px 0; }
.stats > div { padding: 0 28px; min-width: 0; }
.stats > div + div { border-inline-start: 1px solid var(--line); }
@media (max-width: 1100px) {
  .stats { grid-template-columns: 1fr; gap: 26px; }
  .stats > div + div { border-inline-start: 0; border-top: 1px solid var(--line); padding-top: 26px; }
}
.big { display: flex; align-items: baseline; gap: 12px; margin-bottom: 18px; }
.big b { font-family: var(--font-num); font-size: 40px; line-height: 1; font-weight: 800; }
.big span { color: var(--muted); font-size: 17px; }
.donut-row { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.donut { width: 150px; height: 150px; flex: none; }
.dlegend { display: grid; gap: 10px; flex: 1; min-width: 160px; }
.dlegend div { display: flex; align-items: center; gap: 12px; color: var(--muted); }
.dlegend i { width: 20px; height: 5px; border-radius: 3px; flex: none; }
.dlegend b { margin-inline-start: auto; color: var(--ink); font-family: var(--font-num); font-size: 18px; }
.bars-row { display: flex; align-items: flex-end; gap: 16px; margin-top: 22px; flex-wrap: wrap; }
.bars { display: flex; align-items: flex-end; gap: 6px; height: 92px; direction: ltr; }
.bars span { width: 18px; border-radius: 5px; background: var(--blue); }
.bars span.c { background: var(--accent); opacity: .75; }
.bars span.e { background: var(--teal); }
.bars span.m { background: var(--track); }
.bars-meta { display: grid; gap: 0; color: var(--muted); font-size: 13px; }
.bars-meta b { font-family: var(--font-num); font-size: 22px; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
.bars-meta b svg { width: 20px; height: 20px; color: var(--muted); }
.core { display: grid; gap: 18px; }
.core-row { display: flex; align-items: center; gap: 14px; }
.core-row i { width: 18px; height: 18px; border-radius: 5px; flex: none; }
.core-row .n { font-weight: 600; }
.core-row .s { color: var(--muted); font-size: 13px; }
.core-row .v { margin-inline-start: auto; text-align: end; font-size: 14px; white-space: nowrap; }
.core-row .v small { display: block; color: var(--muted); font-size: 12px; }
.tags { display: flex; flex-wrap: wrap; gap: 10px; }
.tag {
  display: inline-flex; align-items: center; gap: 6px; border-radius: 14px; padding: 7px 14px;
  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); font-weight: 600; font-size: 14px; direction: ltr;
}
.tag::before { content: "#"; color: var(--muted); font-weight: 400; }
.tag.up { color: var(--up); }
.tag.down { color: var(--down); }
.dashed-btn {
  display: inline-flex; align-items: center; gap: 10px; margin-top: 18px; padding: 12px 20px; border-radius: 16px;
  border: 1.5px dashed var(--dash); background: transparent; color: var(--muted); font-weight: 700; font-size: 13px; letter-spacing: .03em; cursor: pointer;
}
.dashed-btn svg { width: 20px; height: 20px; }

/* Live price cards */
.live-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; margin-bottom: 18px; }
.live-head .h2 { margin: 0; }
.live-meta { font-size: 13px; color: var(--muted); }
.stale { margin: 0 0 16px; padding: 10px 14px; border-radius: 14px; background: var(--warn-soft); color: var(--warn); font-size: 14px; }
.live-label { display: none; }
.live-stage { display: none; }
.period { display: none; }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
@media (max-width: 1100px) { .cards { grid-template-columns: 1fr; } }
.acard { border: 1px solid var(--line); border-radius: 26px; padding: 22px; display: grid; gap: 14px; min-width: 0; }
.acard-head { display: flex; align-items: center; gap: 14px; }
.tile { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; flex: none; }
.tile svg { width: 22px; height: 22px; }
.tile.bonds { background: rgba(125, 157, 198, 0.16); color: var(--blue); }
.tile.stocks { background: var(--up-soft); color: var(--teal); }
.tile.commodities { background: var(--warn-soft); color: var(--amber); }
.acard-head .t { font-weight: 700; display: block; }
.acard-head .s { color: var(--muted); font-size: 13px; }
.chiprow { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { font-size: 13px; font-weight: 600; padding: 6px 14px; border-radius: 12px; white-space: nowrap; background: var(--tint); }
.pill.up { background: var(--up-soft); color: var(--up); }
.pill.down { background: var(--down-soft); color: var(--down); }
.dbox { border: 1.5px dashed var(--dash); border-radius: 18px; padding: 14px 16px; display: grid; gap: 8px; }
.nums { display: flex; gap: 4px 16px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.nums b { color: var(--ink); font-weight: 600; direction: ltr; unicode-bidi: isolate; }
svg.spark { width: 100%; height: 72px; display: block; direction: ltr; }
.spark-key { font-size: 12px; color: var(--muted); display: flex; gap: 14px; }
.spark-key span::before { content: ""; display: inline-block; width: 14px; height: 0; border-top: 2px solid var(--ink); vertical-align: middle; margin-inline-end: 6px; }
.spark-key span.ma::before { border-top: 2px dashed var(--muted); }

/* Cycle chart */
.chart-box { overflow-x: auto; max-width: 900px; margin-inline: auto; }
svg.cycle { display: block; width: 100%; min-width: 620px; height: auto; direction: ltr; }
svg .col { outline: none; }
svg .col:focus-visible rect.hit { stroke: var(--accent); stroke-width: 2; }
.cycle-legend { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 12.5px; color: var(--muted); margin-top: 10px; min-width: 620px; }
.cycle-legend i { display: inline-block; vertical-align: -2px; margin-inline-end: 7px; }
.lg-pill { width: 26px; height: 14px; border-radius: 7px; background: var(--accent); }
.lg-cell { width: 22px; height: 14px; border-radius: 5px; background: var(--up-soft); border: 1.5px solid var(--up); }
.lg-mixed { color: var(--warn); font-weight: 600; }
svg .col { cursor: pointer; }
svg .col rect.hit { fill: transparent; transition: fill .2s; }
svg .col:hover rect.hit { fill: var(--tint); }
svg .col.sel rect.hit { fill: var(--sel); stroke: var(--pick); stroke-width: 1.5; }
svg .col.live rect.hit { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 5 4; }
svg .col.live.sel rect.hit { stroke-dasharray: none; }
.lg-now { width: 16px; height: 14px; border-radius: 5px; background: var(--accent-soft); border: 1.5px solid var(--accent); }
.lg-pick { width: 16px; height: 14px; border-radius: 5px; background: var(--sel); border: 1.5px solid var(--pick); }
.stage-head .tile.pick { background: var(--sel); color: var(--pick); }

/* Stage detail + checker */
.grid2 { display: grid; grid-template-columns: 1.3fr 1fr; gap: 24px; align-items: start; }
@media (max-width: 1100px) { .grid2 { grid-template-columns: 1fr; } }
.stage-head { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.stage-head .tile { background: var(--accent-soft); color: var(--accent); font-family: var(--font-num); font-weight: 800; font-size: 20px; }
.stage-num { display: block; font-size: 13px; color: var(--muted); }
.stage-head h3 { margin: 0; font-size: 1.25rem; line-height: 1.3; }
.stage-desc { margin: 0 0 16px; max-width: 65ch; }
.assets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.asset { border-radius: 16px; padding: 12px 14px; display: grid; gap: 2px; }
.asset.up { background: var(--up-soft); color: var(--up); }
.asset.down { background: var(--down-soft); color: var(--down); }
.asset .name { font-size: 13px; color: var(--ink); }
.asset .dir { font-weight: 700; }
.macro { margin: 16px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px; font-size: 14px; color: var(--muted); }
.macro li { background: var(--tint); border-radius: 12px; padding: 6px 12px; }
.macro b { color: var(--ink); font-weight: 600; }
.rec { margin-top: 18px; display: grid; gap: 12px; border: 1.5px dashed var(--dash); border-radius: 20px; padding: 18px; }
.rec h4 { margin: 0; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
body.fa .rec h4 { letter-spacing: 0; font-size: 13px; }
.rec p { margin: 0; max-width: 65ch; }
.rec p.strat { font-weight: 700; font-size: 17px; line-height: 1.4; }
.plan { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 640px) { .plan { grid-template-columns: 1fr; } }
.plan-col { border-radius: 16px; padding: 14px 16px; }
.plan-col.add { background: var(--up-soft); }
.plan-col.cut { background: var(--down-soft); }
.plan-col.add h4 { color: var(--up); }
.plan-col.cut h4 { color: var(--down); }
.plan ul, .prep ol { margin: 8px 0 0; padding-inline-start: 20px; display: grid; gap: 6px; font-size: 14px; }
.prep { background: var(--tint); border-radius: 16px; padding: 14px 16px; display: grid; gap: 10px; }
.prep ol { margin: 0; }
.signal { display: flex; gap: 10px; align-items: flex-start; border-top: 1px solid var(--line); padding-top: 12px; font-size: 14px; }
.signal svg { width: 20px; height: 20px; flex: none; color: var(--accent); margin-top: 2px; }
.signal b { display: block; }
.signal span { display: block; }
.signal .now { margin-top: 4px; font-weight: 600; color: var(--accent); }
.tilt { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
@media (max-width: 560px) { .tilt { grid-template-columns: repeat(2, 1fr); } }
.tilt div { background: var(--tint); border-radius: 14px; padding: 8px 12px; font-size: 13px; display: grid; }
.tilt .lv { font-weight: 700; }
.tilt .ow .lv { color: var(--up); }
.tilt .uw .lv { color: var(--down); }
.tilt .n .lv { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; gap: 4px; font-family: var(--font-num); font-weight: 600; font-size: 13px; padding: 5px 12px; border-radius: 12px; background: var(--tint); direction: ltr; }
.chip::before { content: "#"; color: var(--muted); font-weight: 400; }
.chip.up { background: var(--up-soft); color: var(--up); }
.chip.down { background: var(--down-soft); color: var(--down); }
.hint { font-size: 13px; color: var(--muted); margin: 0 0 10px; }

.checker .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; font-weight: 600; }
.checker .row:last-of-type { border-bottom: 0; }
.result { margin-top: 14px; padding: 16px; border-radius: 18px; border: 1.5px dashed var(--dash); }
.result p { margin: 0 0 10px; }
.result .go { display: flex; gap: 8px; flex-wrap: wrap; }
.result .go button { font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 12px; border: 0; background: var(--accent-soft); color: var(--accent); cursor: pointer; }

/* Asset table */
.watch-tools { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px 16px; margin: -6px 0 16px; }
.watch-tools p { margin: 0; font-size: 13px; color: var(--muted); max-width: 70ch; }
.watch-tools label { font-size: 13px; font-weight: 600; display: inline-flex; gap: 8px; align-items: center; cursor: pointer; background: var(--track); padding: 8px 14px; border-radius: 12px; }
.watch-ctl { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.watch-ctl .seg button { padding: 7px 12px; }
.watch-tools label.watch-sort { padding: 4px 6px 4px 14px; }
body.fa .watch-tools label.watch-sort { padding: 4px 14px 4px 6px; }
.watch-sort select { font: inherit; font-weight: 600; border: 0; border-radius: 9px; background: var(--surface); color: var(--ink); padding: 5px 8px; cursor: pointer; }
.watch-count { margin: -6px 0 8px; font-size: 12.5px; color: var(--muted); }
table.watch th button { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; border-radius: 6px; }
table.watch th button:hover { color: var(--ink); }
table.watch th button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
table.watch th button .ar { opacity: .35; font-size: 11px; }
table.watch th[aria-sort] button { color: var(--ink); }
table.watch th[aria-sort] button .ar { opacity: 1; color: var(--accent); }
.table-box { overflow-x: auto; }
table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 520px; font-size: 14px; direction: ltr; }
th, td { padding: 11px 12px; text-align: center; border-bottom: 1px solid var(--line); }
th { font-weight: 600; color: var(--muted); font-size: 13px; }
table.watch { direction: inherit; min-width: 920px; }
table.watch th, table.watch td { text-align: start; }
table.watch tr.group td { font-weight: 700; color: var(--muted); font-size: 12px; padding: 16px 12px 6px; border-bottom: 0; letter-spacing: .04em; text-transform: uppercase; }
body.fa table.watch tr.group td { letter-spacing: 0; font-size: 13px; }
table.watch tr.fit td { background: var(--sel); }
table.watch tr.fit td:first-child { border-start-start-radius: 12px; border-end-start-radius: 12px; }
table.watch tr.fit td:last-child { border-start-end-radius: 12px; border-end-end-radius: 12px; }
table.watch .sym { font-size: 12px; color: var(--muted); }
table.watch td.num.warn { color: var(--warn); font-weight: 700; }
table.watch td.num { direction: ltr; unicode-bidi: isolate; white-space: nowrap; }
body.fa table.watch td.num { text-align: right; }
.pos { color: var(--up); }
.neg { color: var(--down); }
.st { display: inline-flex; gap: 3px; direction: ltr; }
.st span { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; font-size: 11px; background: var(--tint); color: var(--muted); }
.st span.on { background: var(--pick); color: var(--surface); }
.st span.cur { outline: 2px solid var(--accent); outline-offset: 1px; }
.fitlbl { font-size: 13px; font-weight: 600; white-space: nowrap; }
.fitlbl.good { color: var(--up); }
.fitlbl.warn { color: var(--warn); }
.fitlbl.muted { color: var(--muted); font-weight: 400; }

/* History + matrix */
.hist-box { overflow-x: auto; }
.hist { display: grid; grid-template-columns: 3.5em repeat(12, minmax(30px, 1fr)); gap: 5px; direction: ltr; min-width: 480px; font-size: 12px; }
.hist .yr { color: var(--muted); align-self: center; font-family: var(--font-num); font-weight: 600; }
.hist .mh { color: var(--muted); text-align: center; font-family: var(--font-num); }
.cell { height: 32px; border-radius: 9px; display: grid; place-items: center; font-family: var(--font-num); font-weight: 700; border: 0; cursor: pointer; padding: 0; font-size: 12px; }
.cell.c { background: var(--warm-soft); color: var(--half-c-ink); }
.cell.e { background: var(--cool-soft); color: var(--half-e-ink); }
.cell.m { background: transparent; border: 1.5px dashed var(--dash); color: var(--muted); cursor: default; }
.cell.empty { background: transparent; cursor: default; }
.cell.now { outline: 2px solid var(--accent); outline-offset: 1px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); margin-top: 14px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; vertical-align: -1px; margin-inline-end: 6px; }
td.asset-name { font-weight: 600; text-align: left; }
body.fa td.asset-name { text-align: right; }
td.u { color: var(--up); font-weight: 700; }
td.d { color: var(--down); font-weight: 700; }
td.on, th.on { background: var(--sel); }
.note { font-size: 13px; color: var(--muted); margin: 0; max-width: 85ch; }
section[id] { scroll-margin-top: 20px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
html { scroll-behavior: smooth; }

/* ---- Theme: cards, gradient tiles, tabs, pills ---- */
.card { border-radius: 20px; }
.card > h2, .h2, .card-top h2 { font-weight: 800; }
.stats > div + div { border-color: var(--line); }

/* Period switch as text tabs with an orange underline */
.seg.period-seg { background: transparent; padding: 0; gap: 2px; }
.seg.period-seg button { background: transparent; color: var(--muted); font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 6px 10px; border-radius: 8px; }
body.fa .seg.period-seg button { letter-spacing: 0; }
.seg.period-seg button:hover { color: var(--ink); }
.seg.period-seg button[aria-pressed="true"] { background: transparent; box-shadow: none; color: var(--accent); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 6px; }

/* Segmented controls elsewhere */
.seg { background: var(--track); }
.seg button.up[aria-pressed="true"] { background: var(--g-up); }
.seg button.down[aria-pressed="true"] { background: var(--g-down); }

/* Summary: ring donut with orange centre, purple/orange bars */
.donut { width: 160px; height: 160px; }
.bars span { border-radius: 6px; }
.bars span.c { background: var(--accent); opacity: 1; }
.bars span.e { background: var(--blue); }
.core-row i { border-radius: 50%; width: 14px; height: 14px; }
.tag { border-radius: 10px; box-shadow: none; background: var(--tint); border-color: transparent; }
.dashed-btn { border-radius: 12px; }

/* Live prices: gradient tiles */
.cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 1100px) { .cards { grid-template-columns: 1fr; } }
@media (max-width: 640px) { .cards { grid-template-columns: 1fr; } }
.acard { border: 0; border-radius: 18px; color: #fff; padding: 20px; }
.acard.bonds { background: var(--g-purple); box-shadow: 0 12px 26px rgba(90, 59, 239, 0.25); }
.acard.stocks { background: var(--g-blue); box-shadow: 0 12px 26px rgba(43, 98, 238, 0.25); }
.acard.commodities { background: var(--g-teal); box-shadow: 0 12px 26px rgba(25, 168, 173, 0.25); }
.acard.stage { background: var(--g-orange); box-shadow: 0 12px 26px rgba(255, 124, 76, 0.28); }
.acard .tile { background: rgba(255, 255, 255, 0.2); color: #fff; }
.acard-head .t { color: #fff; }
.acard-head .s { color: rgba(255, 255, 255, 0.8); }
.acard .pill, .acard .pill.up, .acard .pill.down { background: rgba(255, 255, 255, 0.2); color: #fff; }
.acard .dbox { border-color: rgba(255, 255, 255, 0.4); }
.acard .nums, .acard .spark-key { color: rgba(255, 255, 255, 0.82); }
.acard .nums b { color: #fff; }
.acard .spark-key span::before { border-top-color: #fff; }
.acard .spark-key span.ma::before { border-top-color: rgba(255, 255, 255, 0.75); }
.acard svg.spark .area { fill: rgba(255, 255, 255, 0.16); }
.acard svg.spark .maline { stroke: rgba(255, 255, 255, 0.75); }
.acard svg.spark .pline { stroke: #fff; }
.stage-big { display: flex; align-items: baseline; gap: 10px; }
.stage-big b { font-family: var(--font-num); font-size: 52px; line-height: 1; font-weight: 800; }
.stage-big span { font-size: 17px; font-weight: 700; }
.acard.stage p { margin: 0; font-size: 13.5px; color: rgba(255, 255, 255, 0.9); }

/* Status pills: solid gradient */
.pill.up { background: var(--g-up); color: #fff; }
.pill.down { background: var(--g-down); color: #fff; }
table.watch .pill { padding: 5px 14px; border-radius: 8px; }

/* Tables */
th { color: var(--ink); font-weight: 800; font-size: 12.5px; letter-spacing: .04em; text-transform: uppercase; }
body.fa th { letter-spacing: 0; font-size: 13px; }
td { border-bottom-color: var(--line); }

/* Stage detail tile + misc */
.stage-head .tile { background: var(--accent-soft); color: var(--accent); }
.result .go button { background: var(--sel); color: var(--pick); }
.st span.on { background: var(--pick); }
.st span.cur { outline-color: var(--accent); }

/* Next move */
.conv { font-size: 12.5px; font-weight: 800; padding: 5px 14px; border-radius: 999px; }
.conv.high { background: var(--up-soft); color: var(--up); }
.conv.mid { background: var(--warn-soft); color: var(--warn); }
.conv.low { background: var(--down-soft); color: var(--down); }
.next { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 1250px) { .next { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) { .next { grid-template-columns: 1fr; } }
.nm-box { background: var(--tint); border-radius: 16px; padding: 16px 18px; display: grid; gap: 10px; align-content: start; font-size: 14px; }
.nm-box h4 { margin: 0; display: flex; align-items: center; gap: 10px; font-size: 14.5px; font-weight: 800; }
.nm-ic { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; color: #fff; flex: none; }
.nm-ic svg { width: 17px; height: 17px; }
.nm-ic.o { background: var(--g-orange); }
.nm-ic.p { background: var(--g-purple); }
.nm-ic.t { background: var(--g-teal); }
.nm-ic.k { background: var(--pick); color: var(--surface); }
.nm-box p { margin: 0; }
.nm-box p.muted { color: var(--muted); font-size: 13px; }
.nm-box p.strong { font-weight: 800; }
/* Sector rotation + backtest */
.rot-box { overflow-x: auto; max-width: 900px; margin-inline: auto; }
svg.rot { display: block; width: 100%; min-width: 620px; height: auto; direction: ltr; }
.rot-legend { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 12.5px; color: var(--muted); margin-top: 10px; }
.rot-legend i { display: inline-block; width: 22px; height: 0; border-top: 3px solid; border-radius: 2px; vertical-align: middle; margin-inline-end: 7px; }
.bt-sub { margin: 30px 0 6px; font-size: 1rem; font-weight: 800; }
.bt-intro { font-size: 13.5px; color: var(--muted); margin: 0 0 12px; max-width: 85ch; }
table.heat { border-collapse: separate; border-spacing: 4px; min-width: 780px; }
table.heat th, table.heat td { border-bottom: 0; padding: 8px 6px; }
table.heat th small { display: block; font-weight: 500; color: var(--muted); text-transform: none; letter-spacing: 0; font-size: 11px; }
table.heat th.on { background: var(--sel); border-radius: 8px; }
table.heat td.lbl { text-align: left; font-weight: 600; white-space: nowrap; }
body.fa table.heat td.lbl { text-align: right; }
table.heat td.lbl .sym { font-size: 12px; color: var(--muted); font-weight: 500; }
table.heat td.hc { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 600; border-radius: 8px; font-size: 13px; cursor: help; direction: ltr; }
table.heat td.hc.sig { font-weight: 800; }
table.heat td.hc.small { opacity: .45; }
table.heat td.hc.claim { box-shadow: inset 0 0 0 2px var(--pick); }
table.heat td.hc.none { color: var(--muted); }
.agree { font-weight: 700; white-space: nowrap; }
.agree.yes { color: var(--up); }
.agree.near { color: var(--warn); }
.agree.no { color: var(--down); }
.verdict { margin: 14px 0 0; padding: 14px 16px; border-radius: 16px; background: var(--tint); font-size: 14px; max-width: 85ch; }
.bt-note { font-size: 12.5px; color: var(--muted); margin: 14px 0 0; max-width: 85ch; }
.btchips .chip::before { content: none; }

/* Strategy test */
table.stab { min-width: 640px; }
table.stab th, table.stab td { text-align: start; }
table.stab td.num { direction: ltr; unicode-bidi: isolate; }
body.fa table.stab td.num { text-align: right; }
table.stab tr.me td { background: var(--accent-soft); font-weight: 700; }
table.stab tr.me td:first-child { border-start-start-radius: 12px; border-end-start-radius: 12px; }
table.stab tr.me td:last-child { border-start-end-radius: 12px; border-end-end-radius: 12px; }
table.stab .sw { display: inline-block; width: 18px; height: 0; border-top: 3px solid; border-radius: 2px; vertical-align: middle; margin-inline-end: 8px; }
table.wtab { min-width: 560px; margin-bottom: 8px; }
table.wtab td { font-family: var(--font-num); font-size: 13px; border-radius: 8px; }

/* Economy */
.econ-foot { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px 24px; align-items: end; margin-top: 16px; }
@media (max-width: 900px) { .econ-foot { grid-template-columns: 1fr; } }
.econ-foot .verdict { margin: 0; }
.ebars { display: flex; align-items: center; gap: 2px; height: 64px; direction: ltr; margin-top: 6px; }
.ebars span { flex: 1; min-width: 2px; border-radius: 2px; }
.vote { font-size: 12.5px; font-weight: 800; padding: 4px 12px; border-radius: 999px; justify-self: start; }
.vote.p { background: var(--up-soft); color: var(--up); }
.vote.z { background: var(--warn-soft); color: var(--warn); }
.vote.n { background: var(--down-soft); color: var(--down); }
svg.mini { width: 100%; height: 54px; display: block; direction: ltr; }
.nm-box .val { font-family: var(--font-num); font-size: 22px; font-weight: 800; direction: ltr; unicode-bidi: isolate; }

.nm-box ul { margin: 0; padding-inline-start: 18px; display: grid; gap: 5px; }
.nm-big { font-size: 19px; font-weight: 800; line-height: 1.3; }
.nm-label { font-size: 12px; font-weight: 700; color: var(--muted); }
.meter { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 4px; background: var(--g-orange); }
.next-note { margin: 14px 0 0; font-size: 12.5px; color: var(--muted); }

/* Overview: sentence, month strip, then "what could change the stage" and "what is working" */
.ltr { direction: ltr; unicode-bidi: isolate; }
.ov-story { margin: 0; font-size: 22px; line-height: 1.55; font-weight: 700; max-width: 62ch; }
body.fa .ov-story { line-height: 1.8; }
.ov-story em { font-style: normal; padding: 1px 7px; border-radius: 7px; white-space: nowrap; }
.ov-story em.acc { background: var(--accent-soft); color: #b86400; }
.ov-story em.up { background: var(--up-soft); color: var(--up); }
.ov-story em.down { background: var(--down-soft); color: var(--down); }
.ov-months { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 6px; margin-top: 18px; direction: ltr; }
.ov-months div { border-radius: 10px; padding: 7px 0; text-align: center; font-size: 12px; min-width: 0; white-space: nowrap; overflow: hidden; }
.ov-months b { display: block; font-size: 16px; font-family: var(--font-num); }
.ov-months .c { background: var(--warm-soft); color: var(--half-c-ink); }
.ov-months .e { background: var(--cool-soft); color: var(--half-e-ink); }
.ov-months .m { background: var(--tint); color: var(--muted); }
.ov-months .now { box-shadow: inset 0 0 0 2px var(--accent); }
.ov-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); margin-top: 22px; border-top: 1px solid var(--line); padding-top: 22px; }
.ov-grid > div { min-width: 0; }
.ov-grid > div:first-child { padding-inline-end: 24px; }
.ov-grid > div + div { border-inline-start: 1px solid var(--line); padding-inline-start: 24px; }
.ov-lbl { font-size: 12.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
body.fa .ov-lbl { letter-spacing: 0; font-size: 13.5px; }
.ov-row { display: grid; gap: 6px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.ov-row:last-child { border-bottom: 0; }
.ov-row .t { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.ov-row .t b { font-weight: 700; }
.ov-row .t .sym { color: var(--muted); font-weight: 600; }
.ov-row .v { font-weight: 700; direction: ltr; unicode-bidi: isolate; white-space: nowrap; }
.ov-row .note { font-size: 13px; color: var(--muted); }
.cbar { position: relative; height: 10px; border-radius: 5px; background: var(--track); direction: ltr; }
.cbar .zero { position: absolute; left: 50%; top: -4px; bottom: -4px; width: 2px; background: var(--ink); opacity: .3; }
.cbar .fill { position: absolute; top: 0; bottom: 0; border-radius: 5px; }
.ov-sub { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 14px 0 4px; font-size: 13.5px; font-weight: 800; }
.ov-sub span + span { color: var(--muted); font-weight: 600; font-size: 12.5px; }
.ov-rank { display: grid; grid-template-columns: 52px minmax(0, 1fr) 64px; gap: 10px; align-items: center; padding: 5px 0; font-size: 14px; }
.ov-rank b { font-weight: 800; font-family: var(--font-num); direction: ltr; }
.ov-rank .v { text-align: end; font-weight: 700; direction: ltr; unicode-bidi: isolate; }
.ov-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); margin-top: 10px; }
.ov-legend i { display: inline-block; width: 14px; height: 8px; border-radius: 4px; margin-inline-end: 5px; }
.ov .dashed-btn { margin-top: 16px; }
@media (max-width: 960px) {
  .ov-grid { grid-template-columns: 1fr; gap: 22px; }
  .ov-grid > div:first-child { padding-inline-end: 0; }
  .ov-grid > div + div { border-inline-start: 0; padding-inline-start: 0; border-top: 1px solid var(--line); padding-top: 22px; }
}
@media (max-width: 560px) {
  .ov-story { font-size: 18px; }
  .ov-months { grid-template-columns: repeat(6, minmax(0, 1fr)); }
}

/* Today card */
.today .ov-story { margin-top: 2px; }
.today-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 12px; }
.today-meta span { background: var(--tint); border-radius: 10px; padding: 5px 12px; font-size: 13.5px; color: var(--ink); }
.today-meta span.warn { background: var(--warn-soft); color: var(--warn); font-weight: 700; }
.today-meta a.deep { background: var(--tint); border-radius: 10px; padding: 5px 12px; font-size: 13.5px; color: var(--ink); text-decoration: none; display: inline-block; }
.today-meta a.deep:hover { box-shadow: inset 0 0 0 1.5px var(--dash); }
.today-meta a.deep b { font-weight: 700; }
.today-meta a.deep.lv1 b { color: var(--warn); }
.today-meta a.deep.lv2 b, .today-meta a.deep.lv3 b { color: var(--up); }
.today-meta a.deep.lv3 { background: var(--up-soft); }
.since { margin-top: 12px; padding: 12px 14px; border-radius: 14px; border: 1.5px dashed var(--dash); }
.since h4 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 700; display: flex; gap: 8px; align-items: center; }
.since h4 svg { width: 16px; height: 16px; flex: none; }
.since ul { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 8px; }
.since li { background: var(--tint); border-radius: 10px; padding: 5px 12px; font-size: 13.5px; }
.since li.pos { background: var(--up-soft); color: var(--up); font-weight: 600; }
.since li.neg { background: var(--down-soft); color: var(--down); font-weight: 600; }
.since li.key { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.since p { margin: 0; font-size: 13.5px; color: var(--muted); }
.today-plan { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 18px; }
@media (max-width: 760px) { .today-plan { grid-template-columns: 1fr; } }
.today .ov-grid { margin-top: 20px; }
/* Sidebar "Research" label and the group heading in the page */
.nav-sep { display: block; margin: 14px 30px 4px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 11.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--side-muted); }
body.fa .nav-sep { letter-spacing: 0; font-size: 12.5px; }
@media (max-width: 960px) { .nav-sep { margin: 0 6px; padding: 8px 0 0; border: 0; align-self: center; } }
.group-title { margin-top: 18px; padding: 18px 4px 0; border-top: 2px dashed var(--dash); }
.group-title h2 { margin: 0; font-size: 1.4rem; font-weight: 800; }
.group-title p { margin: 4px 0 0; color: var(--muted); }

/* What happens next */
.stage-pick { display: inline-flex; gap: 4px; direction: ltr; }
.stage-pick button { width: 36px; height: 36px; border-radius: 10px; border: 0; background: var(--tint); color: var(--muted); font-weight: 800; cursor: pointer; font-family: var(--font-num); }
.stage-pick button.live { box-shadow: inset 0 0 0 2px var(--accent); color: var(--ink); }
.stage-pick button[aria-pressed="true"] { background: var(--pick); color: var(--surface); }
.after-warn { margin: -4px 0 14px; padding: 10px 14px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); font-size: 14px; font-weight: 600; }
.after-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 24px; }
@media (max-width: 960px) { .after-grid { grid-template-columns: 1fr; } }

.nx-bar i { display: block; height: 100%; background: var(--pick); border-radius: 5px; }

/* Deep buy meter */
.deep-pill { font-size: 13px; font-weight: 800; padding: 6px 12px; border-radius: 999px; background: var(--tint); color: var(--muted); }
.deep-pill.lv1, .dlv.lv1 { background: var(--warn-soft); color: var(--warn); }
.deep-pill.lv2, .dlv.lv2 { background: var(--up-soft); color: var(--up); }
.deep-pill.lv3, .dlv.lv3 { background: var(--up); color: #fff; }
.deep-zones { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.deep-zones div { display: grid; gap: 6px; text-align: center; font-size: 12.5px; font-weight: 700; color: var(--muted); }
.deep-zones i { display: block; height: 12px; border-radius: 6px; background: var(--track); }

.deep-zones .on.z0 i { background: var(--muted); }
.deep-zones .on.z1 i { background: var(--warn); }
.deep-zones .on.z2 i { background: #6fd3c4; }
.deep-zones .on.z3 i { background: var(--up); }
.deep-verdict { font-size: 16px; font-weight: 700; margin: 14px 0 16px; max-width: 75ch; }
.deep-checks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 22px; }
@media (max-width: 860px) { .deep-checks { grid-template-columns: 1fr; } }
.deep-checks .after-box { align-content: start; }
.dlv { justify-self: start; font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: var(--surface); color: var(--muted); }
.deep-spark { width: 100%; height: 56px; display: block; direction: ltr; }
.deep-spark-l { font-size: 11.5px; color: var(--muted); }
table.deep-tab { direction: inherit; min-width: 0; width: 100%; border-collapse: separate; border-spacing: 0 4px; font-size: 13.5px; margin-top: 8px; }
table.deep-tab th { font-size: 12px; color: var(--muted); font-weight: 700; text-align: start; padding: 0 8px; }
table.deep-tab td { padding: 7px 8px; background: var(--tint); }
table.deep-tab td:first-child { border-start-start-radius: 10px; border-end-start-radius: 10px; }
table.deep-tab td:last-child { border-start-end-radius: 10px; border-end-end-radius: 10px; }
table.deep-tab tr.ok td:last-child b { color: var(--up); }
table.deep-tab tr.bad td:last-child b { color: var(--down); }
.after-grid.deep-ev { grid-template-columns: minmax(0, 1fr); gap: 16px; }

  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (text != null) n.textContent = text;
  return n;
};
const h = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const stageLabel = (i) => `${T[lang].stage} ${T[lang].num(i + 1)}`;

function drawLive() {
  const t = T[lang];
  const box = document.getElementById("live");
  if (!DATA) { box.hidden = true; return; }
  document.getElementById("t-live").textContent = t.live;
  const stale = document.getElementById("stale");
  stale.hidden = !DATA.stale;
  stale.textContent = t.stale;
  document.getElementById("live-stage").textContent = DATA.stage
    ? t.liveStage(stageLabel(DATA.stage - 1), t.names[DATA.stage - 1])
    : t.liveMixed(DATA.nearest.map((n) => stageLabel(n - 1)).join(lang === "fa" ? "، " : ", "));
  document.getElementById("live-meta").textContent = `${t.asOf(t.date(DATA.asOf))} · ${t.built(DATA.generated)}`;
  document.getElementById("t-period").textContent = t.period;
  document.getElementById("t-period-hint").textContent = t.periodHint;
  // Confirmation-rule switch
  document.getElementById("t-rule").textContent = t.ruleLbl;
  const rseg = document.getElementById("rule-seg");
  rseg.setAttribute("aria-label", t.ruleLbl);
  rseg.replaceChildren();
  RULE_KEYS.forEach((r) => {
    const b = h("button", null, t.ruleOpt[r]);
    b.type = "button"; b.id = "rule-" + r;
    b.title = t.ruleTip[r];
    b.setAttribute("aria-pressed", String(r === rule));
    b.addEventListener("click", () => setRule(r));
    rseg.append(b);
  });
  // Same switch in the sidebar and in the cycle chart header, kept in sync
  document.querySelectorAll(".period-seg[data-where]").forEach((seg) => {
    const where = seg.dataset.where;
    seg.setAttribute("aria-label", t.period);
    seg.replaceChildren();
    PERIOD_KEYS.filter((p) => ALL.periods[p]).forEach((p) => {
      const b = h("button", null, t.periodOpt(p));
      b.type = "button"; b.id = `period-${where}-${p}`;
      b.setAttribute("aria-pressed", String(p === period));
      b.addEventListener("click", () => setPeriod(p, b.id));
      seg.append(b);
    });
  });

  const cards = document.getElementById("cards");
  cards.replaceChildren();
  ASSETS.forEach((a) => {
    const d = DATA.assets[a];
    const up = d.dir > 0;
    const card = h("div", "acard " + a);
    const head = h("div", "acard-head");
    const tile = h("div", "tile " + a);
    tile.innerHTML = ICONS[a];
    const txt = h("div");

      h("span", "pill " + (up ? "up" : "down"), (up ? "↑ " : "↓ ") + (up ? t.rising : t.falling)),

    );

    cards.append(card);
  });
}

// ---- Overview: one sentence, the month strip, then "what could change the stage" and "what is working" ----
function drawOverview(t, f) {
  if (!DATA) return;
  const escH = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const iso = (s) => `<span class="ltr num">${s}</span>`;
  const sgn = (v, d = 2) => (v > 0 ? "+" : v < 0 ? "−" : "") + t.fmt(Math.abs(v), d) + "%";
  const thr = rule === "band" ? 2 : 0;
  // % move needed before an asset's trend flips under the current confirmation rule
  const flipDist = (a) => (a.dir > 0 ? Math.max(0, a.gap + thr) : Math.max(0, thr - a.gap));
  const stageOf = (dirs) => STAGES.findIndex((s) => ASSETS.every((k, i) => s[k] === dirs[i]));
  const A = DATA.assets;
  const live = liveStageIdx;

  // 1. Sentence
  const word = (k) => `<em class="${A[k].dir > 0 ? "up" : "down"}">${escH(t.ovWord(t.assets[k], A[k].dir > 0))}</em>`;
  const H = DATA.history || [];
  let story;
  if (live != null) {
    let since = 0;
    for (let i = H.length - 1; i >= 0 && H[i].stage === live + 1; i--) since++;
    const nxt = (live + 1) % 6;
    const fk = ASSETS.find((k) => STAGES[nxt][k] !== STAGES[live][k]);
    const d = flipDist(A[fk]);
    const fitAll = WATCH.filter((w) => !w.error && w.stages.includes(live + 1));
    const fitUp = fitAll.filter((w) => wp(w).dir > 0);
    const flip = d > 0 ? t.ovFlip(t.assets[fk], iso(sgn(d).replace(/^[+−]/, "")), stageLabel(nxt)) : t.ovFlipDone(t.assets[fk], stageLabel(nxt));
    story = t.ovStory(`<em class="acc">${escH(stageLabel(live) + " · " + t.names[live])}</em>`, escH(t.ovMonths(t.num(Math.max(since, 1)))),
      word("bonds"), word("stocks"), word("commodities"), t.num(fitUp.length), t.num(fitAll.length), flip);
  } else {
    story = t.ovMixed(word("bonds"), word("stocks"), word("commodities"), escH(DATA.nearest.map((n) => stageLabel(n - 1)).join(lang === "fa" ? "، " : ", ")));
  }
  document.getElementById("ov-story").innerHTML = story;

  // 2. Stage by month (last 12 month-ends)
  const loc = lang === "fa" ? "fa-IR" : "en-US";
  document.getElementById("ov-months").innerHTML = H.slice(-12).map((r, i, arr) => {
    const m = new Date(r.month + "-28T12:00:00").toLocaleDateString(loc, { month: "short" });
    const cls = r.stage ? (r.stage <= 3 ? "c" : "e") : "m";
    const title = `${t.date(r.month + "-28")}: ${r.stage ? stageLabel(r.stage - 1) : t.statMixed}`;
    return `<div class="${cls}${i === arr.length - 1 ? " now" : ""}" title="${escH(title)}"><b>${r.stage ? t.num(r.stage) : "–"}</b>${escH(m)}</div>`;
  }).join("");

  // 3. Core assets: centred bars (±10%), distance to flip and what a flip would mean
  document.getElementById("ov-core-l").textContent = t.ovCoreL(t.num(period));
  document.getElementById("ov-core").innerHTML = ASSETS.map((k, i) => {
    const a = A[k], up = a.dir > 0, g = Math.max(-10, Math.min(10, a.gap));
    const dirs = ASSETS.map((x) => A[x].dir);
    dirs[i] = -dirs[i];
    const into = stageOf(dirs);
    const note = t.ovFlipNote(iso(sgn(flipDist(a)).replace(/^[+−]/, "")), into >= 0 ? t.ovInto(stageLabel(into)) : t.ovIntoMixed);
    return `<div class="ov-row"><div class="t"><b>${escH(t.assets[k])} <span class="sym ltr">${escH(a.symbol)}</span></b><span class="v ${up ? "pos" : "neg"}">${up ? "↑" : "↓"} ${sgn(a.gap)}</span></div>
      <div class="cbar"><span class="zero"></span><span class="fill" style="left:${g >= 0 ? 50 : 50 + g * 5}%;width:${Math.max(1.2, Math.abs(g) * 5)}%;background:${up ? "var(--up)" : "var(--down)"}"></span></div>
      <span class="note">${note}</span></div>`;
  }).join("");

  // 4. Assets for the stage: confirming (rising) and waiting, ranked by 3-month return on one shared scale
  const fit = WATCH.filter((w) => !w.error && w.stages.includes(f + 1));
  const conf = fit.filter((w) => wp(w).dir > 0), wait = fit.filter((w) => wp(w).dir < 0);
  const mx = Math.max(...fit.map((w) => Math.abs(w.ret.m3 || 0)), 1);
  const byRet = (x, y) => (y.ret.m3 || 0) - (x.ret.m3 || 0);
  const row = (w) => {
    const r = w.ret.m3 || 0, half = (Math.abs(r) / mx) * 50, rising = wp(w).dir > 0;
    return `<div class="ov-rank"><b class="${rising ? "pos" : "neg"}" title="${escH(w[lang])}">${escH(w.symbol)}</b>
      <div class="cbar"><span class="zero"></span><span class="fill" style="left:${r >= 0 ? 50 : 50 - half}%;width:${Math.max(1, half)}%;background:${r >= 0 ? "var(--up)" : "var(--down)"};opacity:${rising ? 1 : 0.45}"></span></div>
      <span class="v ${r >= 0 ? "pos" : "neg"}">${sgn(r, 1)}</span></div>`;
  };
  document.getElementById("ov-fit-l").textContent = t.ovFitL(stageLabel(f));
  document.getElementById("ov-fit").innerHTML =
    (conf.length ? `<div class="ov-sub pos"><span>${escH(t.ovConf(t.num(conf.length)))}</span><span>${escH(t.ovConfSub)}</span></div>${[...conf].sort(byRet).map(row).join("")}` : "")
    + (wait.length ? `<div class="ov-sub neg"><span>${escH(t.ovWait(t.num(wait.length)))}</span><span>${escH(t.ovWaitSub)}</span></div>${[...wait].sort(byRet).map(row).join("")}` : "");
  document.getElementById("ov-legend").innerHTML =
    `<span><i style="background:var(--up)"></i>${escH(t.ovGain)}</span><span><i style="background:var(--down)"></i>${escH(t.ovLoss)}</span><span><i style="background:var(--down);opacity:.45"></i>${escH(t.ovFaded)}</span>`;
}

function drawNext() {

  // Agreement across the four moving averages
  const avail = PERIOD_KEYS.filter((p) => pd(p));
  const agree = avail.filter((p) => pd(p).stage === f + 1);
  const others = avail.filter((p) => pd(p).stage !== f + 1);
  const level = agree.length === avail.length ? "high" : agree.length * 2 > avail.length ? "mid" : "low";
  const conv = document.getElementById("next-conv");
  conv.className = "conv " + level;
  conv.textContent = t.conv[level];

  // One line of supporting facts
  const meta = document.getElementById("today-meta");
  meta.replaceChildren();
  const fact = (txt, cls) => { const s = h("span", cls || null, txt); meta.append(s); };
  fact(t.agree(t.num(agree.length), t.num(avail.length), stageLabel(f)) + (others.length ? " " + t.others(others.map((p) => `${t.periodShort(p)} → ${pd(p).stage ? stageLabel(pd(p).stage - 1) : t.statMixed}`).join(lang === "fa" ? "، " : ", ")) : ""));
  const ea = econAgree();
  if (ea) {
    const agreeF = ea.side ? ea.side === stageSide(f + 1) : null;
    fact(t.nextEcon(signed(ea.M.score, 0), agreeF), agreeF === false ? "warn" : null);
  }
  const ok = WATCH.filter((w) => !w.error);
  if (ok.length) fact(t.breadth(t.num(ok.filter((w) => wp(w).dir > 0).length), t.num(ok.length)));
  const ds = deepState();
  if (ds) {
    const a = h("a", "deep lv" + ds.lv);

    meta.append(a);
  }
  drawSince();

  // Two plan boxes: what to do now, and how to get ready for the next stage
  const grid = document.getElementById("next-grid");
  grid.replaceChildren();
  const box = (cls, icon, title) => {
    const bx = h("div", "nm-box");
    const hd = h("h4");
    const ic = h("span", "nm-ic " + cls);
    ic.innerHTML = icon;
    hd.append(ic, h("span", null, title));
    bx.append(hd);
    grid.append(bx);
    return bx;
  };
  const list = (items) => { const ul = h("ul"); items.forEach((x) => ul.append(h("li", null, x))); return ul; };
  const b1 = box("o", '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4L19 6"/></svg>', t.doT);
  b1.append(h("p", "strong", pl.strategy), list(pl.focus));
  const nxt = (f + 1) % 6;
  const b2 = box("k", '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>', t.hPrepare(stageLabel(nxt)));
  b2.append(list(pl.prepare));
  b2.append(h("p", "muted", t.reduceT + ": " + pl.reduce.join(lang === "fa" ? "؛ " : "; ")));

  document.getElementById("next-note").textContent = t.nextNote;
}

// ---- "Since your last visit": a snapshot kept in this browser only ----
// cur = the reading seen on the latest visit; prev = the reading from the visit before new data arrived.
function makeSnap() {
  const keys = Object.keys(ALL.periods);
  const snap = { asOf: ALL.asOf, stage: {}, deep: {}, dirs: {}, vix: ALL.deep && ALL.deep.vix ? ALL.deep.vix.now : null, score: ALL.macro ? ALL.macro.score : null };
  keys.forEach((k) => {
    snap.stage[k] = ALL.periods[k].stage || 0;
    const d = deepState(ALL.periods[k]);
    if (d) snap.deep[k] = d.lv;
  });
  WATCH.forEach((w) => { if (!w.error) { snap.dirs[w.symbol] = {}; keys.forEach((k) => { if (w.periods[k]) snap.dirs[w.symbol][k] = w.periods[k].dir; }); } });
  return snap;
}
let VISIT = null;
function visitState() {
  if (VISIT || !ALL) return VISIT;
  VISIT = { prev: null };
  try {
    const old = JSON.parse(localStorage.getItem("cycle-visit") || "null");
    const now = makeSnap();
    if (old && old.cur && old.cur.asOf !== now.asOf) VISIT = { prev: old.cur, cur: now };
    else if (old && old.cur) VISIT = { prev: old.prev || null, cur: old.cur };
    else VISIT = { prev: null, cur: now };
    localStorage.setItem("cycle-visit", JSON.stringify(VISIT));
  } catch (e) {}
  return VISIT;
}
function drawSince() {
  const t = T[lang];
  const box = document.getElementById("since");
  const V = visitState();
  if (!V || !V.cur) { box.hidden = true; return; }
  box.hidden = false;
  const escH = (x) => String(x).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const icon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>';
  const P = V.prev;
  if (!P) { box.innerHTML = `<p>${escH(t.chgFirst)}</p>`; return; }
  const k = PK(period);
  const ltr = (v) => `<span class="ltr num">${escH(v)}</span>`;
  const sl = (st) => (st ? stageLabel(st - 1) : t.statMixed);
  const items = [];
  const add = (txt, cls) => items.push(`<li${cls ? ` class="${cls}"` : ""}>${txt}</li>`);
  let changed = false;
  const a = P.stage ? P.stage[k] : undefined, b = DATA.stage || 0;
  if (a !== undefined && a !== b) { add(escH(t.chgStage(sl(a), sl(b))), "key"); changed = true; }
  else add(escH(t.chgStageSame(sl(b))));
  const da = P.deep ? P.deep[k] : undefined, ds = deepState();
  if (da !== undefined && ds && da !== ds.lv) { add(escH(t.chgDeep(t.deepLevels[da], t.deepLevels[ds.lv])), "key"); changed = true; }
  const ups = [], downs = [];
  WATCH.forEach((w) => {
    if (w.error || !P.dirs || !P.dirs[w.symbol]) return;
    const was = P.dirs[w.symbol][k], now = wp(w).dir;
    if (was && now && was !== now) (now > 0 ? ups : downs).push(w);
  });
  const names = (arr) => arr.map((w) => `<span class="ltr" title="${escH(w[lang])}">${escH(w.symbol)}</span>`).join(lang === "fa" ? "، " : ", ");
  if (ups.length) { add(t.chgUp(names(ups)), "pos"); changed = true; }
  if (downs.length) { add(t.chgDown(names(downs)), "neg"); changed = true; }
  const vNow = ALL.deep && ALL.deep.vix ? ALL.deep.vix.now : null;
  if (P.vix != null && vNow != null && Math.abs(vNow - P.vix) >= 0.5) { add(t.chgVix(ltr(t.fmt(P.vix, 1)), ltr(t.fmt(vNow, 1)))); changed = true; }
  const sNow = ALL.macro ? ALL.macro.score : null;
  if (P.score != null && sNow != null && P.score !== sNow) { add(t.chgScore(ltr(signed(P.score, 0)), ltr(signed(sNow, 0)))); changed = true; }
  if (!changed) add(escH(t.chgNone));
  box.innerHTML = `<h4>${icon}<span>${escH(t.chgT(t.date(P.asOf)))}</span></h4><ul>${items.join("")}</ul>`;
}

function sparkKey() {

function spark(s, up) {
  const w = 300, hgt = 72, pad = 4;
  const all = s.price.concat(s.ma);
  const lo = Math.min(...all), hi = Math.max(...all);
  const x = (i) => pad + (i / (s.price.length - 1)) * (w - 2 * pad);
  const y = (v) => pad + (1 - (v - lo) / (hi - lo || 1)) * (hgt - 2 * pad);
  const line = (arr) => arr.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join("");
  const svg = el("svg", { class: "spark", viewBox: `0 0 ${w} ${hgt}`, preserveAspectRatio: "none", role: "img" });
  const area = line(s.price) + `L${x(s.price.length - 1)} ${hgt}L${x(0)} ${hgt}Z`;
  svg.append(el("path", { class: "area", d: area, fill: up ? "var(--up-soft)" : "var(--down-soft)", stroke: "none" }));
  svg.append(el("path", { class: "maline", d: line(s.ma), fill: "none", stroke: "var(--muted)", "stroke-width": 1.5, "stroke-dasharray": "4 3", "vector-effect": "non-scaling-stroke" }));
  svg.append(el("path", { class: "pline", d: line(s.price), fill: "none", stroke: up ? "var(--up)" : "var(--down)", "stroke-width": 1.75, "vector-effect": "non-scaling-stroke" }));
  return svg;
}

function drawChart() {
  const t = T[lang];
  const svg = document.getElementById("cycle");
  svg.replaceChildren();
  svg.style.fontFamily = lang === "fa" ? "var(--font-fa)" : "var(--font-en)";
  const A = (o) => Object.assign({ "pointer-events": "none" }, o);
  const colX = (i) => X0 + i * COL;
  const midX = (i) => i * COL + COL / 2; // in curve coordinates

  // Clickable stage columns (also keyboard focusable)
  STAGES.forEach((_, i) => {
    const g = el("g", { class: "col" + (i === sel ? " sel" : "") + (i === liveStageIdx ? " live" : ""), id: "col-" + i, tabindex: i === sel ? 0 : -1, role: "button", "aria-pressed": String(i === sel), "aria-label": `${stageLabel(i)}: ${t.names[i]}` });
    g.append(el("rect", { class: "hit", x: colX(i) + 3, y: 2, width: COL - 6, height: H - 4, rx: 14 }));
    g.addEventListener("click", () => select(i));
    g.addEventListener("keydown", (e) => {
      const step = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
      if (step) { e.preventDefault(); select((sel + step + 6) % 6, true); }
      else if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(i, true); }
    });
    svg.append(g);
  });

  // Stage headers
  STAGES.forEach((_, i) => {
    const cx = colX(i) + COL / 2, on = i === sel, live = i === liveStageIdx;

    svg.append(el("text", A({ x: cx, y: 25, "text-anchor": "middle", "font-size": 13, "font-weight": 800, fill: color }), stageLabel(i) + (live ? ` · ${t.now}` : "")));
    svg.append(el("text", A({ x: cx, y: 43, "text-anchor": "middle", "font-size": 11.5, "font-weight": on || live ? 700 : 500, fill: on || live ? "var(--ink)" : "var(--muted)" }), t.names[i]));
  });

  // Shaded contraction / expansion halves, midline, curve
  let down = `M${X0} ${MID}`, up = `M${X0 + W / 2} ${MID}`;
  for (let x = 0; x <= W / 2; x += 4) down += `L${X0 + x} ${curveY(x).toFixed(1)}`;
  for (let x = W / 2; x <= W; x += 4) up += `L${X0 + x} ${curveY(x).toFixed(1)}`;
  svg.append(el("path", A({ d: down + "Z", fill: "var(--warm-soft)" })));
  svg.append(el("path", A({ d: up + "Z", fill: "var(--cool-soft)" })));
  svg.append(el("line", A({ x1: X0, x2: X0 + W, y1: MID, y2: MID, stroke: "var(--dash)", "stroke-width": 1.5, "stroke-dasharray": "4 5" })));
  let d = "";
  for (let x = 0; x <= W; x += 3) d += (x ? "L" : "M") + (X0 + x) + " " + curveY(x).toFixed(1);
  svg.append(el("path", A({ d, fill: "none", stroke: "var(--curve)", "stroke-width": 3, "stroke-linecap": "round" })));

  svg.append(el("text", A({ x: X0 + W * 0.75, y: MID - 12, "text-anchor": "middle", "font-size": 12.5, "font-weight": 700, fill: "var(--half-e-ink)" }), t.expansion));
  svg.append(el("text", A({ x: X0 + W * 0.25, y: MID + 22, "text-anchor": "middle", "font-size": 12.5, "font-weight": 700, fill: "var(--half-c-ink)" }), t.contraction));
  svg.append(el("text", A({ x: X0 + W * 0.75, y: MID - AMP + 20, "text-anchor": "middle", "font-size": 11.5, "font-weight": 600, fill: "var(--muted)" }), t.peak));
  svg.append(el("text", A({ x: X0 + W * 0.25, y: MID + AMP - 10, "text-anchor": "middle", "font-size": 11.5, "font-weight": 600, fill: "var(--muted)" }), t.trough));

  // Selected-stage marker, sliding along the curve
  if (liveStageIdx != null && sel !== liveStageIdx) {
    const lx = midX(liveStageIdx);
    svg.append(el("circle", A({ cx: X0 + lx, cy: curveY(lx), r: 8, fill: "var(--surface)", stroke: "var(--accent)", "stroke-width": 3 })));
  }
  const dot = el("circle", A({ r: 7, fill: sel === liveStageIdx ? "var(--accent)" : "var(--pick)", stroke: "var(--surface)", "stroke-width": 3 }));
  svg.append(dot);
  const place = (x) => { dot.setAttribute("cx", X0 + x); dot.setAttribute("cy", curveY(x)); };
  const target = midX(sel), from = dotX ?? target;
  dotX = target;
  if (from === target || matchMedia("(prefers-reduced-motion: reduce)").matches) place(target);
  else {
    const t0 = performance.now();
    const step = (now) => {
      const k = Math.min(1, (now - t0) / 450), e = 1 - Math.pow(1 - k, 3);
      place(from + (target - from) * e);
      if (k < 1) requestAnimationFrame(step);
    };
    place(from);
    requestAnimationFrame(step);
  }

  // Moving-average markers: where each average puts the market
  const byStage = {}, mixed = [];
  if (ALL) PERIOD_KEYS.forEach((p) => {
    const s = pd(p) && pd(p).stage;
    if (s) (byStage[s - 1] = byStage[s - 1] || []).push(p);
    else if (pd(p)) mixed.push(p);
  });
  Object.entries(byStage).forEach(([key, ps]) => {
    const i = +key;
    const rows = ps.length > 2 ? [ps.slice(0, 2), ps.slice(2)] : [ps];
    rows.forEach((row, r) => {
      const widths = row.map((p) => 14 + t.periodShort(p).length * 6.4);
      const total = widths.reduce((a, b) => a + b, 0) + (row.length - 1) * 4;
      const x0 = midX(i) - total / 2;
      let x = X0 + x0;
      // Keep tags clear of the sloped curve: outside the shaded area when there is room
      let lo = Infinity, hi = -Infinity;
      for (let sx = x0 - 4; sx <= x0 + total + 4; sx += 4) { const yy = curveY(sx); lo = Math.min(lo, yy); hi = Math.max(hi, yy); }
      const need = rows.length * 22;
      const below = i < 3 ? STRIP - (hi + 6) >= need : !(lo - 6 - need >= 50);
      const y = below ? hi + 6 + r * 22 : lo - 24 - r * 22;
      row.forEach((p, k) => {
        const on = p === period, w = widths[k];
        svg.append(el("rect", A({ x, y, width: w, height: 18, rx: 9, fill: on ? "var(--accent)" : "var(--surface)", stroke: "var(--accent)", "stroke-width": 1.2 })));
        svg.append(el("text", A({ x: x + w / 2, y: y + 13, "text-anchor": "middle", "font-size": 11, "font-weight": 700, fill: on ? "#fff" : "var(--accent)" }), t.periodShort(p)));
        x += w + 4;
      });
    });
  });

  // Asset signal strip: one row per asset, outlined where it changes direction
  ASSETS.forEach((a, r) => {
    const y = STRIP + r * 40;
    svg.append(el("text", A({ x: X0 - 12, y: y + 22, "text-anchor": "end", "font-size": 12.5, "font-weight": 700, fill: "var(--ink)" }), t.assets[a]));
    STAGES.forEach((s, i) => {
      const upA = s[a] > 0, turn = STAGES[(i + 5) % 6][a] !== s[a];
      const x = colX(i) + 8, w = COL - 16;
      svg.append(el("rect", A({ x, y: y + 4, width: w, height: 28, rx: 9, fill: upA ? "var(--up-soft)" : "var(--down-soft)", stroke: turn ? (upA ? "var(--up)" : "var(--down)") : "none", "stroke-width": 1.6 })));
      svg.append(el("text", A({ x: x + w / 2, y: y + 23, "text-anchor": "middle", "font-size": 14, "font-weight": 800, fill: upA ? "var(--up)" : "var(--down)" }), upA ? "↑" : "↓"));
    });
  });

  // Legend under the chart
  const lg = document.getElementById("cycle-legend");
  lg.replaceChildren();
  const item = (cls, label) => { const s = h("span"); s.append(h("i", cls), document.createTextNode(label)); lg.append(s); };
  item("lg-now", t.legNowStage);
  item("lg-pick", t.legPick);
  item("lg-pill", t.maLegend);
  item("lg-cell", t.turnLegend);
  mixed.forEach((p) => lg.append(h("span", "lg-mixed", t.mixedNote(p))));
}

const pct = (v) => (v == null ? "–" : (v > 0 ? "+" : "") + T[lang].fmt(v) + "%");
const sign = (v) => (v == null ? "" : v >= 0 ? " pos" : " neg");

// Watchlist filter and sort, remembered in this browser
let watchCfg = { filter: "all", sort: "def", desc: true };
try { const c = JSON.parse(localStorage.getItem("cycle-watch") || "null"); if (c) watchCfg = Object.assign(watchCfg, c); } catch (e) {}
const WATCH_SORTS = ["def", "name", "trend", "gap", "flip", "m3", "m12"];
// column index → sort key (columns without a key are not sortable)
const WATCH_COL_SORT = ["name", null, "trend", "gap", "flip", "m3", "m12", null];
function setWatch(c) {
  Object.assign(watchCfg, c);
  try { localStorage.setItem("cycle-watch", JSON.stringify(watchCfg)); } catch (e) {}
  drawWatch();
}
// % move needed before an asset's trend flips under the current confirmation rule
function flipGap(p) {
  const thr = rule === "band" ? 2 : 0;
  return p.dir > 0 ? Math.max(0, p.gap + thr) : Math.max(0, thr - p.gap);
}

function drawWatch() {
  const t = T[lang];
  const sec = document.getElementById("watch-sec");
  if (!WATCH.length) { sec.hidden = true; return; }
  document.getElementById("t-watch").textContent = t.watchTitle;
  document.getElementById("t-watch-hint").textContent = t.watchHint;

  // Filter buttons
  const fb = document.getElementById("watch-filter");
  fb.replaceChildren();
  fb.setAttribute("aria-label", t.watchTitle);
  Object.entries(t.watchFilters).forEach(([k, lbl]) => {
    const b = h("button", k === "up" ? "up" : k === "down" ? "down" : null, k === "fit" ? lbl + " " + stageLabel(sel) : lbl);
    b.type = "button";
    b.title = k === "fit" ? lbl + " " + stageLabel(sel) : lbl;
    b.setAttribute("aria-pressed", String(watchCfg.filter === k));
    b.addEventListener("click", () => setWatch({ filter: k }));
    fb.append(b);
  });
  // Sort menu
  document.getElementById("t-watch-sort").textContent = t.watchSortL;
  const ss = document.getElementById("watch-sort");
  ss.title = t.watchSortL;
  ss.replaceChildren();
  WATCH_SORTS.forEach((k) => { const o = h("option", null, t.watchSorts[k]); o.value = k; ss.append(o); });
  ss.value = watchCfg.sort;

  const fitOf = (w) => w.stages.includes(sel + 1);
  const keep = (w) => {
    const f = watchCfg.filter;
    if (f === "fit") return fitOf(w);
    if (f === "up" || f === "down") return !w.error && wp(w).dir === (f === "up" ? 1 : -1);
    return true;
  };
  let rows = WATCH.filter(keep);
  const S = watchCfg.sort, dsc = watchCfg.desc ? 1 : -1;
  if (S !== "def") {
    const val = (w) => {
      const p = wp(w);
      if (S === "trend") return p.dir * 1000 + p.gap;
      if (S === "gap") return p.gap;
      if (S === "flip") return -flipGap(p);       // closest to flipping first
      if (S === "m3") return w.ret.m3 ?? -Infinity;
      if (S === "m12") return w.ret.m12 ?? -Infinity;
      return 0;
    };
    rows = [...rows].sort((x, y) => {
      if (x.error || y.error) return (x.error ? 1 : 0) - (y.error ? 1 : 0);
      if (S === "name") return dsc * x[lang].localeCompare(y[lang], lang);
      return dsc * (val(y) - val(x));
    });
  }
  document.getElementById("watch-count").textContent = t.watchCount(t.num(rows.length), t.num(WATCH.length));

  const tb = document.getElementById("watch");
  tb.replaceChildren();
  const head = h("tr");
  t.cols.forEach((c, i) => {
    const th = h("th");
    const key = WATCH_COL_SORT[i];
    if (!key) { th.textContent = c; head.append(th); return; }
    const on = S === key;
    if (on) th.setAttribute("aria-sort", watchCfg.desc ? "descending" : "ascending");
    const b = h("button");
    b.type = "button";
    b.title = t.watchSortBy(c);
    b.append(h("span", null, c), h("span", "ar", on ? (watchCfg.desc ? "▼" : "▲") : "↕"));
    // first click: the most useful order (A→Z, rising first, closest to flip, best return); second click reverses
    b.addEventListener("click", () => setWatch(on ? { desc: !watchCfg.desc } : { sort: key, desc: true }));
    th.append(b);
    head.append(th);
  });
  tb.append(head);
  let group = null;
  rows.forEach((w) => {
    const inFavor = fitOf(w);
    if (S === "def" && w.group !== group) {
      group = w.group;
      const gr = h("tr", "group");
      const td = h("td", null, t.groups[group] || group);
      td.colSpan = t.cols.length;
      gr.append(td);
      tb.append(gr);
    }
    const tr = h("tr", inFavor ? "fit" : "");
    const name = h("td");
    name.append(h("span", null, w[lang] + " "), h("span", "sym mono", w.symbol));
    const st = h("span", "st");
    for (let i = 1; i <= 6; i++) st.append(h("span", (w.stages.includes(i) ? "on" : "") + (i === sel + 1 ? " cur" : ""), t.num(i)));
    const stTd = h("td");
    stTd.append(st);
    tr.append(name, stTd);
    if (w.error) {
      const td = h("td", "fitlbl muted", t.noData);
      td.colSpan = t.cols.length - 2;
      tr.append(td);
      tb.append(tr);
      return;
    }
    const p = wp(w);
    const up = p.dir > 0;
    const trendTd = h("td");
    trendTd.append(h("span", "pill " + (up ? "up" : "down"), (up ? "↑ " + t.rising : "↓ " + t.falling)));
    const [key, cls] = inFavor ? (up ? ["good", "good"] : ["warn", "warn"]) : (up ? ["off", "muted"] : ["out", "muted"]);
    const fg = flipGap(p);
    tr.append(
      trendTd,
      h("td", "num" + sign(p.gap), pct(p.gap)),
      h("td", "num" + (fg < 1 ? " warn" : ""), t.fmt(fg, 1) + "%"),
      h("td", "num" + sign(w.ret.m3), pct(w.ret.m3)),
      h("td", "num" + sign(w.ret.m12), pct(w.ret.m12)),
      h("td", "fitlbl " + cls, t.fit[key]),
    );
    tb.append(tr);
  });
}

  const B = ALL && ALL.backtest;

// Stage with the highest average; ignore small samples unless nothing else exists
function bestStage(cells) {
  if (!cells) return null;
  const pick = (allowSmall) => {
    let best = null;
    for (let s = 1; s <= 6; s++) {
      const c = cells[s];
      if (!c || (c.small && !allowSmall)) continue;
      if (best == null || c.avg > cells[best].avg) best = s;
    }
    return best;
  };
  return pick(false) ?? pick(true);
}
const stageDist = (a, b) => { const d = Math.abs(a - b); return Math.min(d, 6 - d); };
const fmtPct = (v) => (v > 0 ? "+" : "") + T[lang].fmt(v, 1);

  const econY = (x) => RM + RA * Math.sin((2 * Math.PI * x) / RW);
  const mktY = (x) => RM + RA * Math.sin((2 * Math.PI * (x + LEAD)) / RW);
  const A = (o) => Object.assign({ "pointer-events": "none" }, o);

  STAGES.forEach((_, i) => {
    const g = el("g", { class: "col" + (i === sel ? " sel" : "") + (i === liveStageIdx ? " live" : ""), role: "button", tabindex: -1, "aria-label": `${stageLabel(i)}: ${t.names[i]}` });

  const stacks = {};
  SECTOR_META.forEach(([sym, en, fa, tb]) => {

    if (!s) return;
    const c = cells && cells[s];
    if (btMode === "data" && (!c || c.avg <= 0)) return; // never beat the market in any stage

  });

  Object.entries(stacks).forEach(([s, items]) => {
    if (btMode === "data") items.sort((a, b) => (b.c ? b.c.avg : 0) - (a.c ? a.c.avg : 0));
    items.forEach((it, k) => {
      const strong = btMode === "data" && it.c && Math.abs(it.c.t) >= 2 && !it.c.small;

      const txt = btMode === "data" && it.c ? `${it.label} ⁦${fmtPct(it.c.avg)}⁩` : it.label;
      svg.append(el("text", A({
        x: RX + (s - 1) * RC + RC / 2, y: 30 + k * 19, "text-anchor": "middle", "font-size": 11.5,
        "font-weight": btMode === "tb" || strong ? 800 : 600,
        fill: btMode === "tb" ? "var(--ink)" : strong ? "var(--ink)" : "var(--muted)",
        direction: t.dir,
      }), txt));
    });
  });

  // Curves: economy (purple) and stock market (orange, leading)
  const area = (fy) => {
    let d = `M${RX} ${RM}`;
    for (let x = 0; x <= RW; x += 4) d += `L${RX + x} ${fy(x).toFixed(1)}`;
    return d + `L${RX + RW} ${RM}Z`;
  };
  const line = (fy) => {
    let d = "";
    for (let x = 0; x <= RW; x += 3) d += (x ? "L" : "M") + (RX + x) + " " + fy(x).toFixed(1);
    return d;
  };
  svg.append(el("path", A({ d: area(mktY), fill: "var(--warm-soft)" })));
  svg.append(el("path", A({ d: area(econY), fill: "var(--cool-soft)" })));
  svg.append(el("line", A({ x1: RX, x2: RX + RW, y1: RM, y2: RM, stroke: "var(--dash)", "stroke-width": 1.5, "stroke-dasharray": "4 5" })));
  svg.append(el("path", A({ d: line(mktY), fill: "none", stroke: "var(--accent)", "stroke-width": 3, "stroke-linecap": "round" })));
  svg.append(el("path", A({ d: line(econY), fill: "none", stroke: "var(--curve)", "stroke-width": 3, "stroke-linecap": "round" })));

  // Phase bands
  const band = (y, edges, labels, fill, ink, title) => {
    svg.append(el("text", A({ x: RX - 12, y: y + 19, "text-anchor": "end", "font-size": 12.5, "font-weight": 700, fill: "var(--ink)" }), title));
    labels.forEach((lb, k) => {
      const x0 = RX + edges[k] * RC, x1 = RX + edges[k + 1] * RC;
      svg.append(el("rect", A({ x: x0 + 2, y, width: x1 - x0 - 4, height: 28, rx: 9, fill })));
      svg.append(el("text", A({ x: (x0 + x1) / 2, y: y + 19, "text-anchor": "middle", "font-size": 12, "font-weight": 700, fill: ink, direction: t.dir }), lb));
    });
  };
  band(312, [0, 1.5, 3, 4.5, 6], t.econPhases, "var(--sel)", "var(--blue)", t.econ);
  band(346, [0, 1, 2.75, 3.75, 6], t.mktPhases, "var(--accent-soft)", "var(--accent)", t.market);

  STAGES.forEach((_, i) => {
    const on = i === sel, live = i === liveStageIdx;
    svg.append(el("text", A({ x: RX + i * RC + RC / 2, y: 392, "text-anchor": "middle", "font-size": 12, "font-weight": on || live ? 800 : 600, fill: live ? "var(--accent)" : on ? "var(--pick)" : "var(--muted)" }), stageLabel(i)));
  });

  const lg = document.getElementById("rot-legend");
  lg.replaceChildren();
  [["var(--curve)", t.econ], ["var(--accent)", t.market]].forEach(([c, label]) => {
    const s = h("span");

    i.style.borderTopColor = c;
    s.append(i, document.createTextNode(label));
    lg.append(s);
  });
  if (btMode === "data") lg.append(h("span", null, t.rotDataNote));
}

function heatCell(c, excess, claim) {
  const t = T[lang];
  if (!c) return h("td", "hc none", "–");
  const strength = Math.min(Math.abs(c.avg) / 20, 1);
  const td = h("td", "hc" + (Math.abs(c.t) >= 2 && !c.small ? " sig" : "") + (c.small ? " small" : "") + (claim ? " claim" : ""), fmtPct(c.avg));
  td.style.background = `color-mix(in srgb, ${c.avg >= 0 ? "var(--up)" : "var(--down)"} ${Math.round(6 + strength * 40)}%, transparent)`;
  td.title = (excess ? t.tipEx : t.tipAbs)(fmtPct(c.avg), t.num(c.hit), t.num(c.n), t.fmt(c.t, 2));
  return td;
}

function heatHead(bt, firstCol, extra) {
